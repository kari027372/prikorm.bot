    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:sans-serif;background:#f5f0eb;display:flex;justify-content:center;padding:0}
        #app{max-width:480px;width:100%;background:#fff;min-height:100vh;padding:16px 16px 80px;position:relative}
        .tab-bar{display:flex;gap:10px;background:#fff;padding:10px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .tab-bar button{flex:1;padding:10px;border:none;border-radius:10px;background:#f0ebe7;cursor:pointer;font-weight:600}
        .tab-bar button.active{background:#d4a373;color:#fff}
        .page{display:none}
        .page.active{display:block}
        .baby-card{display:flex;align-items:center;background:#fafafa;padding:16px;border-radius:12px;margin:12px 0}
        .baby-avatar{font-size:48px;margin-right:16px}
        .progress-card{background:#fafafa;padding:16px;border-radius:12px;margin:12px 0}
        .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
        .quick-action{background:#fafafa;border:none;border-radius:12px;padding:16px;text-align:left;cursor:pointer}
        .quick-action span{font-size:28px;display:block}
        .quick-action strong{display:block;margin-top:6px}
        .quick-action small{color:#888}
        .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
        .product-item{background:#fafafa;padding:12px;border-radius:8px;text-align:center;cursor:pointer}
        .product-item .emoji{font-size:30px;display:block}
        .diary-entry{display:flex;align-items:center;background:#fafafa;padding:12px;border-radius:8px;margin-bottom:8px}
        .diary-entry .info{flex:1}
        .settings-row{display:flex;align-items:center;background:#fafafa;padding:12px;border-radius:8px;margin-bottom:6px;border:none;width:100%;text-align:left;cursor:pointer}
        .settings-row span:first-child{font-size:20px;margin-right:12px}
        .settings-row div{flex:1}
        .settings-row strong{display:block}
        .settings-row small{color:#888}
        .danger-button{background:#e74c3c;color:#fff;border:none;border-radius:8px;padding:14px;width:100%;font-weight:700;cursor:pointer;margin:16px 0}
        .empty-state{text-align:center;padding:40px 20px;color:#999}
        .empty-state .empty-icon{font-size:64px}
        .empty-state h3{font-size:18px;color:#555}
        .empty-state p{font-size:14px}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;background:#fff;padding:8px 0;border-top:1px solid #ddd}
        .bottom-nav button{background:none;border:none;font-size:12px;color:#888;cursor:pointer}
        .bottom-nav button.active{color:#d4a373;font-weight:700}
    </style>

    { name:'Пюре из индейки с кабачком', products:['Индейка','Кабачок'], age:6, desc:'Отварить мясо и кабачок, пюрировать.', emoji:'🍲' },
    { name:'Тыквенное пюре', products:['Тыква'], age:5, desc:'Запечь тыкву, размять вилкой.', emoji:'🎃' },
    { name:'Рисовая каша с яблоком', products:['Рис','Яблоко'], age:6, desc:'Сварить рис, добавить тёртое яблоко.', emoji:'🍚' }
];

// 3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
let STATE = {
    baby: { name: 'Малыш', ageMonths: 6, feedingType: 'ГВ' },
    diary: [],
    introduced: []
};

// 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
function isIntroduced(id) {
    return STATE.introduced.some(i => i === id);
}

// 5. РЕНДЕРИНГ
function render(screen) {
    screen = screen || 'home';
    const app = document.getElementById('app');
    if (!app) return;

    let html = '';

    // Вкладки
    const tabs = [
        { id:'home', label:'Главная' },
        { id:'products', label:'Продукты' },
        { id:'diary', label:'Дневник' },
        { id:'recipes', label:'Рецепты' },
        { id:'baby', label:'Малыш' }
    ];
    html += `<div class="tab-bar">`;
    tabs.forEach(t => {
        html += `<button class="${screen===t.id?'active':''}" data-screen="${t.id}">${t.label}</button>`;
    });
    html += `</div>`;

    // Содержимое
    if (screen === 'home') html += renderHome();
    else if (screen === 'products') html += renderProducts();
    else if (screen === 'diary') html += renderDiary();
    else if (screen === 'recipes') html += renderRecipes();
    else if (screen === 'baby') html += renderBaby();

    // Нижняя навигация (дубль для удобства)
    html += `<div class="bottom-nav">`;
    tabs.forEach(t => {
        html += `<button class="${screen===t.id?'active':''}" data-screen="${t.id}">${t.label}</button>`;
    });
    html += `</div>`;

    app.innerHTML = html;

    // Обработчики кликов по кнопкам навигации
    document.querySelectorAll('[data-screen]').forEach(btn => {
        btn.addEventListener('click', function() {
            render(this.dataset.screen);
        });
    });

    // Обработчики для добавления продукта в дневник (клик по продукту)
    document.querySelectorAll('.product-item').forEach(el => {
        el.addEventListener('click', function() {
            const id = this.dataset.id;
            if (id && !isIntroduced(id)) {
                STATE.introduced.push(id);
                STATE.diary.push({ product: id, date: new Date().toISOString().slice(0,10) });
                render('products');
            }
        });
    });

    // Обработчик сброса
    document.querySelectorAll('[data-action="reset"]').forEach(btn => {
        btn.addEventListener('click', function() {
            if (confirm('Удалить все данные?')) {
                STATE.diary = [];
                STATE.introduced = [];
                render('home');
            }
        });
    });

    // Редактирование профиля
    document.querySelectorAll('[data-action="edit-baby"]').forEach(btn => {
        btn.addEventListener('click', function() {
            const newName = prompt('Имя малыша:', STATE.baby.name);
            if (newName !== null) {
                STATE.baby.name = newName || 'Малыш';
                render('baby');
            }
        });
    });
}

function renderHome() {
    const count = STATE.diary.length;
    const baby = STATE.baby;
    return `
        <div class="page active">
            <h1 style="margin:0 0 8px;">🌸 Прикорм</h1>
            <div class="baby-card">
                <div class="baby-avatar">👶</div>
                <div><strong>${baby.name}</strong><br>${baby.ageMonths} мес.</div>
            </div>
            <div class="progress-card">
                <strong>Дневник</strong> <span style="float:right;">${count} записей</span>
            </div>
            <div class="quick-actions">
                <button class="quick-action" onclick="render('products')"><span>🥑</span><strong>Продукты</strong><small>Выберите и добавьте</small></button>
                <button class="quick-action" onclick="render('diary')"><span>📖</span><strong>Дневник</strong><small>История</small></button>
                <button class="quick-action" onclick="render('recipes')"><span>🍲</span><strong>Рецепты</strong><small>Идеи</small></button>
                <button class="quick-action" onclick="render('baby')"><span>👶</span><strong>Малыш</strong><small>Профиль</small></button>
            </div>
        </div>
    `;
}

function renderProducts() {
    let html = `<div class="page active"><h2>Продукты</h2><div class="product-grid">`;
    PRODUCTS.forEach(p => {
        const done = isIntroduced(p.id) ? ' ✅' : '';
        html += `<div class="product-item" data-id="${p.id}">
            <span class="emoji">${p.emoji}</span>
            ${p.name}${done}
            <div style="font-size:12px;color:#888;">${p.cat}, ${p.min_age}+ мес.</div>
        </div>`;
    });
    html += `</div></div>`;
    return html;
}

function renderDiary() {
    let html = `<div class="page active"><h2>Дневник</h2>`;
    if (STATE.diary.length === 0) {
        html += `<div class="empty-state"><div class="empty-icon">📖</div><h3>Дневник пуст</h3><p>Добавьте продукты из списка.</p></div>`;
    } else {
        STATE.diary.forEach(entry => {
            const product = PRODUCTS.find(p => p.id === entry.product);
            const name = product ? product.name : entry.product;
            html += `<div class="diary-entry"><div class="info"><strong>${name}</strong><br><small>${entry.date}</small></div></div>`;
        });
    }
    html += `</div>`;
    return html;
}

function renderRecipes() {
    let html = `<div class="page active"><h2>Рецепты</h2>`;
    RECIPES.forEach(r => {
        html += `<div style="background:#fafafa;padding:12px;border-radius:8px;margin-bottom:8px;"><strong>${r.name}</strong> (с ${r.age} мес.)<br><small>${r.desc}</small></div>`;
    });
    html += `</div>`;
    return html;
}

function renderBaby() {
    const baby = STATE.baby;
    return `
        <div class="page active">
            <h2>Малыш</h2>
            <div class="baby-card">
                <div class="baby-avatar">👶</div>
                <div><strong>${baby.name}</strong><br>${baby.ageMonths} мес.</div>
                <button data-action="edit-baby" style="margin-left:auto;background:none;border:none;font-size:24px;cursor:pointer;">✏️</button>
            </div>
            <div class="settings-row"><span>🍼</span><div><strong>Тип кормления</strong><br><small>${baby.feedingType}</small></div></div>
            <button class="danger-button" data-action="reset">Сбросить все данные</button>
        </div>
    `;
}

// 6. ЗАПУСК
render('home');
</script>
</body>
</html>
