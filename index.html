<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F8F5F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Прикорм 🌸</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ЭКРАН ЗАГРУЗКИ (должен быть виден до загрузки стилей) */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f0eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #ddd;
            border-top-color: #d4a373;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #888;
        }
        .loading-version {
            margin-top: 8px;
            font-size: 14px;
            color: #bbb;
        }
        .progress-track {
            width: 80%;
            max-width: 300px;
            margin-top: 16px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            height: 8px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #d4a373;
            transition: width 0.3s;
        }
        .progress-text {
            margin-top: 8px;
            font-size: 14px;
            color: #888;
        }
        .progress-file {
            margin-top: 4px;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">🌸 Загрузка приложения...</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text">0%</div>
        <div class="progress-file" id="progress-file">Загрузка файлов...</div>
        <div class="loading-version">v2.1.0</div>
    </div>

    <div id="app"></div>

    <script src="config.js"></script>
    <script src="products.js"></script>
    <script src="recipes.js"></script>
    <script src="diary.js"></script>
    <script src="safety.js"></script>
    <script src="recommendations.js"></script>
    <script src="utils.js"></script>
    <script src="state.js"></script>
    <script src="onboarding.js"></script>
    <script src="ui.js"></script>
    <script src="rendering.js"></script>
    <script src="handlers.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>

    <script>
        (function() {
            var e = [
                { src: 'config.js' },
                { src: 'products.js' },
                { src: 'recipes.js' },
                { src: 'diary.js' },
                { src: 'safety.js' },
                { src: 'recommendations.js' },
                { src: 'utils.js' },
                { src: 'state.js' },
                { src: 'onboarding.js' },
                { src: 'ui.js' },
                { src: 'rendering.js' },
                { src: 'handlers.js' },
                { src: 'theme.js' },
                { src: 'app.js' }
            ];
            var t = 0;
            var n = document.getElementById('progress-fill');
            var r = document.getElementById('progress-text');
            var o = document.getElementById('progress-file');

            function loadScript(src, callback) {
                var script = document.createElement('script');
                script.src = src;
                script.onload = function() { callback(true); };
                script.onerror = function() { callback(false); };
                document.head.appendChild(script);
            }

            function loadNext(index) {
                if (index >= e.length) {
                    var failed = e.filter(function(file) { return file.loaded === false; });
                    if (failed.length > 0) {
                        o.textContent = '⚠️ Не удалось загрузить ' + failed.length + ' файлов';
                        setTimeout(function() { location.reload(); }, 3000);
                    } else {
                        o.textContent = '✅ Готово!';
                        setTimeout(function() {
                            var ls = document.getElementById('loading-screen');
                            ls.classList.add('hidden');
                            setTimeout(function() { ls.style.display = 'none'; }, 600);
                        }, 400);
                    }
                    return;
                }
                var file = e[index];
                o.textContent = 'Загрузка: ' + file.src;
                loadScript(file.src, function(success) {
                    file.loaded = success;
                    t++;
                    n.style.width = Math.round((t / e.length) * 100) + '%';
                    r.textContent = Math.round((t / e.length) * 100) + '%';
                    loadNext(index + 1);
                });
            }

            loadNext(0);

            setTimeout(function() {
                var ls = document.getElementById('loading-screen');
                if (ls && !ls.classList.contains('hidden')) {
                    o.textContent = '⏳ Медленное соединение...';
                }
            }, 5000);
        })();
    </script>
</body>
</html>
