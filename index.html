<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F8F5F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Прикорм 🌸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>

    <!-- ============================================================
         ПРИНУДИТЕЛЬНАЯ ЗАГРУЗКА ВСЕХ СКРИПТОВ
         Порядок ВАЖЕН!
    ============================================================ -->

    <script>
        // Уведомление о начале загрузки
        console.log('🚀 Начинаем загрузку приложения...');
        // Перехват всех ошибок
        window.onerror = function(message, source, line, col, error) {
            console.error('❌ ГЛОБАЛЬНАЯ ОШИБКА:', message, error);
            alert('Ошибка: ' + message + '\n' + (error ? error.stack : ''));
            return true;
        };
    </script>

    <script src="config.js"></script>
    <script>
        console.log('✅ config.js загружен');
    </script>

    <script src="products.js"></script>
    <script>
        console.log('✅ products.js загружен, PRODUCTS =', typeof PRODUCTS !== 'undefined' ? PRODUCTS.length : 'НЕ ОПРЕДЕЛЁН');
    </script>

    <script src="recipes.js"></script>
    <script>
        console.log('✅ recipes.js загружен, RECIPES =', typeof RECIPES !== 'undefined' ? RECIPES.length : 'НЕ ОПРЕДЕЛЁН');
    </script>

    <script src="diary.js"></script>
    <script>
        console.log('✅ diary.js загружен');
    </script>

    <script src="safety.js"></script>
    <script>
        console.log('✅ safety.js загружен');
    </script>

    <script src="recommendations.js"></script>
    <script>
        console.log('✅ recommendations.js загружен');
    </script>

    <script src="utils.js"></script>
    <script>
        console.log('✅ utils.js загружен');
    </script>

    <script src="state.js"></script>
    <script>
        console.log('✅ state.js загружен, STATE =', typeof STATE !== 'undefined' ? 'ОПРЕДЕЛЁН' : 'НЕ ОПРЕДЕЛЁН');
    </script>

    <script src="ui.js"></script>
    <script>
        console.log('✅ ui.js загружен');
    </script>

    <script src="rendering.js"></script>
    <script>
        console.log('✅ rendering.js загружен');
    </script>

    <script src="handlers.js"></script>
    <script>
        console.log('✅ handlers.js загружен');
    </script>

    <script src="theme.js"></script>
    <script>
        console.log('✅ theme.js загружен');
    </script>

    <script src="app.js"></script>
    <script>
        console.log('✅ app.js загружен, запускаем initApp()...');
        // Принудительный запуск, если app.js не сработал
        if (typeof initApp === 'function') {
            initApp();
        } else {
            console.error('❌ Функция initApp не найдена!');
            alert('Ошибка: initApp не определена. Проверьте app.js');
        }
    </script>

    <!-- ============================================================
         КОНСОЛЬ ДЛЯ ТЕЛЕФОНА (Eruda)
         Появится круглая иконка в правом нижнем углу
    ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init();
        console.log('✅ Eruda загружена! Нажмите на кружок в правом нижнем углу.');
        // Дополнительно показываем окно с ошибками, если они есть
        setTimeout(function() {
            console.log('⏳ Приложение запущено. Если есть ошибки, они будут здесь.');
        }, 1000);
    </script>

</body>
</html>
