    <script>eruda.init();</script>

    <!-- ============================================================
         ЗАПУСК ПРИЛОЖЕНИЯ
         ============================================================ -->
    <script>
        (function() {
            function hideLoading() {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('hidden');
                    setTimeout(function() { ls.style.display = 'none'; }, 600);
                }
            }

            function startApp() {
                console.log('🚀 Запуск приложения...');
                if (typeof startApplication === 'function') {
                    startApplication();
                    hideLoading();
                    return;
                }
                if (typeof initApp === 'function') {
                    initApp();
                    hideLoading();
                    return;
                }
                if (typeof render === 'function') {
                    render();
                    hideLoading();
                    return;
                }
                console.warn('⚠️ render() не найдена, создана заглушка.');
                window.render = function() {
                    document.getElementById('app').innerHTML = 
                        '<div style="padding:40px;text-align:center;">' +
                        '<div style="font-size:48px;">🌸</div>' +
                        '<h2 style="margin:20px 0 10px;">Прикорм</h2>' +
                        '<p style="color:var(--text-muted);">Заглушка render() – проверьте rendering.js</p>' +
                        '</div>';
                };
                render();
                hideLoading();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startApp);
            } else {
                startApp();
            }
        })();
    </script>
</body>
</html>
