<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F8F5F1">
    <title>Прикорм 🌸 (отладка)</title>
    <style>
        /* базовые стили для отладочной страницы */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f5f0eb;
            padding: 16px;
            margin: 0;
        }
        #debug {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #f0ebe7;
            font-size: 14px;
        }
        .log-entry.ok { color: #2e7d32; }
        .log-entry.error { color: #c62828; font-weight: bold; }
        .log-entry.warn { color: #f57c00; }
        .log-entry.info { color: #1976d2; }
        .log-entry .time {
            color: #999;
            font-size: 12px;
            margin-right: 8px;
        }
        #app {
            margin-top: 20px;
            background: var(--bg-app, #fff);
            padding: 16px;
            border-radius: 12px;
            min-height: 100px;
        }
        /* сброс для основного интерфейса (если он появится) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        /* простая загрузка */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: #d4a373;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="debug">
        <h2>🔍 Отладка приложения</h2>
        <div id="log-container"></div>
        <div id="app"></div>
    </div>

    <script>
        // ---- Отладочный логгер ----
        const logContainer = document.getElementById('log-container');
        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">${time}</span> ${msg}`;
            logContainer.appendChild(entry);
            console.log(msg);
        }

        // перехват ошибок
        window.onerror = function(message, source, line, col, error) {
            log(`❌ ОШИБКА: ${message} (${source}:${line})`, 'error');
            return true;
        };

        log('🚀 Начало загрузки', 'info');

        // ---- Список скриптов ----
        const FILES = [
            'config.js',
            'products.js',
            'recipes.js',
            'diary.js',
            'safety.js',
            'recommendations.js',
            'utils.js',
            'state.js',
            'onboarding.js',
            'ui.js',
            'rendering.js',
            'handlers.js',
            'theme.js',
            'app.js'
        ];

        let loaded = 0;
        const total = FILES.length;

        function loadScript(src, callback) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = function() {
                log(`✅ ${src} загружен`, 'ok');
                callback(true);
            };
            script.onerror = function() {
                log(`❌ ${src} НЕ ЗАГРУЗИЛСЯ (404)`, 'error');
                callback(false);
            };
            document.head.appendChild(script);
        }

        function loadNext(index) {
            if (index >= total) {
                const failed = FILES.filter((f, i) => !f.loaded).length;
                if (failed > 0) {
                    log(`⚠️ Не удалось загрузить ${failed} файлов`, 'error');
                } else {
                    log('✅ Все файлы загружены', 'ok');
                    // через секунду запускаем приложение
                    setTimeout(startApp, 300);
                }
                return;
            }
            const file = FILES[index];
            loadScript(file, function(success) {
                file.loaded = success;
                loaded++;
                loadNext(index + 1);
            });
        }

        // ---- Функция запуска приложения ----
        function startApp() {
            log('🚀 Запуск приложения...', 'info');
            try {
                // проверяем наличие render
                if (typeof render === 'function') {
                    log('✅ render найден, вызываем render("home")', 'ok');
                    render('home');
                } else if (typeof renderApp === 'function') {
                    log('✅ renderApp найден', 'ok');
                    renderApp();
                } else if (typeof initApp === 'function') {
                    log('✅ initApp найден', 'ok');
                    initApp();
                } else {
                    log('❌ Нет ни render, ни renderApp, ни initApp!', 'error');
                    document.getElementById('app').innerHTML = `
                        <div style="padding:20px;color:red;background:#ffe0e0;border-radius:12px;">
                            <h3>Ошибка</h3>
                            <p>Не найдены функции рендеринга.</p>
                            <p>Проверьте, что файлы <b>rendering.js</b> и <b>app.js</b> загружены.</p>
                        </div>
                    `;
                }
            } catch (e) {
                log(`❌ Исключение при запуске: ${e.message}`, 'error');
                document.getElementById('app').innerHTML = `
                    <div style="padding:20px;color:red;background:#ffe0e0;border-radius:12px;">
                        <h3>Ошибка при запуске</h3>
                        <p>${e.message}</p>
                        <pre style="font-size:12px;white-space:pre-wrap;">${e.stack}</pre>
                    </div>
                `;
            }
        }

        // ---- Запускаем загрузку ----
        loadNext(0);

        // таймаут на случай зависания
        setTimeout(function() {
            if (loaded < total) {
                log('⏳ Загрузка затянулась... Проверьте подключение', 'warn');
            }
        }, 5000);
    </script>
</body>
</html>
