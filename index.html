    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прикорм 🌸</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f4f0; }
        #app { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; }
        .error { color: red; background: #ffe0e0; padding: 10px; border-radius: 8px; margin: 10px 0; }
        .ok { color: green; }
        .log { background: #f0f0f0; padding: 8px; border-radius: 6px; margin: 4px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>🌸 Прикорм</h2>
        <div id="status">Загрузка...</div>
        <div id="log"></div>
    </div>

    <script>
        // ============================================================
        // 1. Показываем сообщения на экране
        // ============================================================
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const p = document.createElement('div');
            p.className = 'log';
            p.style.color = type === 'error' ? 'red' : type === 'ok' ? 'green' : '#333';
            p.textContent = msg;
            logDiv.appendChild(p);
            console.log(msg);
        }

        function setStatus(msg, isError = false) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.style.color = isError ? 'red' : 'green';
        }

        // Перехват ошибок
        window.onerror = function(message, source, line, col, error) {
            log('❌ ОШИБКА: ' + message + ' (в ' + (source || 'неизвестно') + ' строка ' + line + ')', 'error');
            setStatus('❌ Ошибка! Смотрите лог ниже.', true);
            return true;
        };

        log('🚀 Начинаем загрузку...', 'ok');
        setStatus('Загрузка...');
    </script>

         ЗАГРУЗКА ВСЕХ СКРИПТОВ С ОТЛОВОМ ОШИБОК

    <script>
        try {
            log('📁 Загружаем config.js...');
            var s1 = document.createElement('script');
            s1.src = 'config.js';

            s1.onerror = function() { log('❌ config.js НЕ ЗАГРУЗИЛСЯ (404)', 'error'); };
            document.head.appendChild(s1);
        } catch(e) { log('❌ Ошибка config.js: ' + e.message, 'error'); }
    </script>

    <script>

    <!-- Консоль Eruda (для телефона) -->
