                <circle cx="54" cy="56" r="3" fill="#4A3A30"/>
                <circle cx="66" cy="56" r="3" fill="#4A3A30"/>

                <span style="opacity:1; transform:none;">A</span>
            </div>
            <div class="splash-subtitle" style="opacity:1; transform:none;">прикорм без паники</div>

            <div class="splash-text" style="margin-top:8px; font-size:14px; color:var(--kenora-text-muted);">Загрузка...</div>
        </div>
    </div>

    <!-- ===== СТАРТОВЫЙ ЭКРАН (SPLASH) ===== -->
    <div id="splash-screen" style="display:none;">
        <div class="splash-container">
            <svg class="splash-illustration" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="72" r="32" stroke="#F5A88C" stroke-width="3" fill="#FFF0E6"/>
                <circle cx="60" cy="70" r="26" stroke="#F5A88C" stroke-width="2" fill="#FFE4D6"/>
                <path d="M50 52 C50 44 56 38 60 38 C64 38 70 44 70 52" stroke="#8FBCB5" stroke-width="2.5" fill="#C4E0D8"/>
                <circle cx="55" cy="48" r="4" fill="#8FBCB5"/>
                <circle cx="65" cy="48" r="4" fill="#8FBCB5"/>
                <circle cx="54" cy="56" r="3" fill="#4A3A30"/>
                <circle cx="66" cy="56" r="3" fill="#4A3A30"/>
                <path d="M54 62 Q60 68 66 62" stroke="#4A3A30" stroke-width="2" stroke-linecap="round"/>
                <ellipse cx="50" cy="60" rx="4" ry="3" fill="#FAD8B0" opacity="0.6"/>
                <ellipse cx="70" cy="60" rx="4" ry="3" fill="#FAD8B0" opacity="0.6"/>
            </svg>
            <div class="splash-logo">
                <span class="splash-letter" style="animation-delay: 0.4s;">K</span>
                <span class="splash-letter" style="animation-delay: 0.6s;">E</span>
                <span class="splash-letter" style="animation-delay: 0.8s;">N</span>
                <span class="splash-letter" style="animation-delay: 1.0s;">O</span>
                <span class="splash-letter" style="animation-delay: 1.2s;">R</span>
                <span class="splash-letter" style="animation-delay: 1.4s;">A</span>
            </div>
            <div class="splash-subtitle">прикорм без паники</div>
            <button class="splash-btn" id="start-app-btn">Начать</button>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app" style="display:none;"></div>

    <!-- ПРИВЕТСТВЕННЫЙ ЭКРАН ДЛЯ ПЕРВОГО ЗАПУСКА -->

    <script>eruda.init();</script>

    <!-- ЗАПУСК -->
    <script>
        (function() {
            function hideLoading() {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('hidden');
                    setTimeout(function() {
                        ls.style.display = 'none';
                    }, 600);
                }
            }

            function showSplash() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.display = 'flex';
                    setTimeout(function() {
                        splash.classList.add('visible');
                    }, 50);
                }
            }

            function hideSplashAndShowApp() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.remove('visible');
                    splash.classList.add('hiding');
                    setTimeout(function() {
                        splash.style.display = 'none';
                        var app = document.getElementById('app');
                        if (app) app.style.display = 'block';
                        splash.classList.remove('hiding');
                    }, 400);
                } else {
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            }

            function startApp() {
                console.log('🚀 Запуск KENORA...');
                if (typeof startApplication === 'function') {
                    startApplication();
                } else if (typeof initApp === 'function') {
                    initApp();
                } else if (typeof render === 'function') {
                    render();
                } else {
                    console.warn('⚠️ Не найдена функция запуска приложения!');
                }
                hideLoading();
                showSplash();
            }

            document.addEventListener('DOMContentLoaded', function() {
                var startBtn = document.getElementById('start-app-btn');
                if (startBtn) {
                    startBtn.addEventListener('click', function() {
                        hideSplashAndShowApp();
                    });
                } else {
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startApp);
            } else {
                startApp();
            }
        })();
    </script>
