<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F8F5F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Прикорм 🌸</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        :root{--bg-body:#f5f0eb;--bg-app:#ffffff;--bg-card:#fafafa;--bg-hover:#f0ebe7;--bg-primary:#d4a373;--bg-primary-hover:#c4956a;--bg-success:#e8f5e9;--bg-warning:#f5faf5;--bg-danger:#e74c3c;--text-primary:#2d1f14;--text-secondary:#555;--text-muted:#888;--text-light:#999;--text-on-primary:#fff;--border-color:#f0ebe7;--border-input:#e8e0d8;--border-success:#a5d6a7;--shadow:0 2px 8px rgba(0,0,0,0.04);--shadow-strong:0 4px 12px rgba(0,0,0,0.06);--shadow-up:0 -2px 10px rgba(0,0,0,0.04);--radius:16px;--radius-sm:8px;--radius-lg:24px;--font-family:'Segoe UI',Roboto,sans-serif}
        body{font-family:var(--font-family);background:var(--bg-body);color:var(--text-primary);display:flex;justify-content:center;padding:0;min-height:100vh}
        #app{max-width:480px;width:100%;background:var(--bg-app);min-height:100vh;padding:16px 16px 90px;position:relative}
        /* === Загрузка === */
        #loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-body);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.6s}
        #loading-screen.hidden{opacity:0;pointer-events:none}
        .spinner{width:48px;height:48px;border:4px solid var(--border-color);border-top-color:var(--bg-primary);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loading-text{margin-top:20px;font-size:18px;color:var(--text-muted)}
        .loading-version{margin-top:8px;font-size:14px;color:var(--text-light)}
        /* === Карточки === */
        .baby-profile-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:16px;border:1px solid var(--border-color);box-shadow:var(--shadow)}
        .baby-profile-card .baby-avatar{font-size:48px;line-height:1}
        .baby-profile-card strong{font-size:18px;color:var(--text-primary)}
        .baby-profile-card .muted{font-size:14px;color:var(--text-muted)}
        .progress-card{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid var(--border-color);box-shadow:var(--shadow)}
        .progress-card .header{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:600;color:var(--text-primary)}
        .progress-track{background:var(--bg-hover);height:8px;border-radius:10px;overflow:hidden}
        .progress-fill{background:var(--bg-primary);height:100%;border-radius:10px;transition:width 0.5s ease}
        .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
        .quick-action{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:6px}
        .quick-action:active{transform:scale(0.96);background:var(--bg-hover)}
        .quick-action span{font-size:32px;display:block}
        .quick-action strong{font-size:14px;color:var(--text-primary);display:block}
        .quick-action small{font-size:12px;color:var(--text-muted);display:block}
        .bottom-navigation{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;background:var(--bg-app);padding:8px 0 12px;border-top:1px solid var(--border-color);box-shadow:var(--shadow-up);z-index:100}
        .bottom-navigation .nav-item{background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;transition:color 0.2s;flex:1}
        .bottom-navigation .nav-item span:first-child{font-size:22px;display:block}
        .bottom-navigation .nav-item.active{color:var(--bg-primary);font-weight:700}
        .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-top:8px}
        .page-header h1{font-size:24px;font-weight:700;color:var(--text-primary)}
        .icon-button{background:none;border:none;font-size:20px;cursor:pointer;padding:6px;border-radius:10px}
        .muted{color:var(--text-muted);font-size:14px}
        .screen{display:block;animation:fadeIn 0.4s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
        .empty-state .empty-icon{font-size:64px;display:block;margin-bottom:12px}
        .empty-state h3{font-size:18px;color:var(--text-secondary);margin-bottom:8px}
        .empty-state p{font-size:14px}
        .danger-button{background:var(--bg-danger);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px;width:100%;font-weight:700;cursor:pointer;margin:16px 0}
    </style>
</head>
<body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">🌸 Загрузка приложения...</div>
        <div class="loading-version">v2.1.0</div>
    </div>

    <div id="app"></div>

    <script>
        // ============================================================
        // ПРОСТОЙ РЕНДЕРИНГ (всё в одном файле, без внешних зависимостей)
        // ============================================================
        const DEFAULT_STATE = {
            baby: { name: 'Кадим', birthDate: '2026-02-01', feedingType: 'ГВ' },
            diary: [],
            introduced: [],
            products: []
        };

        let STATE = JSON.parse(localStorage.getItem('prikorm_app_state')) || DEFAULT_STATE;

        function saveState() {
            localStorage.setItem('prikorm_app_state', JSON.stringify(STATE));
        }

        function calcAge(birthDate) {
            if (!birthDate) return 'Возраст не указан';
            const birth = new Date(birthDate);
            const now = new Date();
            let months = (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
            if (months < 0) return 'Возраст не указан';
            if (months < 12) return months + ' мес.';
            const years = Math.floor(months / 12);
            const rem = months % 12;
            return years + ' г. ' + rem + ' мес.';
        }

        function renderHome() {
            const baby = STATE.baby || {};
            const age = calcAge(baby.birthDate);
            const introducedCount = STATE.introduced.length;
            const totalProducts = 20; // просто для демонстрации
            const progressPct = Math.min(Math.round(introducedCount / totalProducts * 100), 100);
            return `
                <div class="screen">
                    <div class="page-header">
                        <h1>🌸 Прикорм</h1>
                        <button class="icon-button" data-action="navigate" data-screen="settings">⚙️</button>
                    </div>
                    <div class="baby-profile-card">
                        <div class="baby-avatar">👶</div>
                        <div><strong>${baby.name || 'Малыш'}</strong><br><span class="muted">${age}</span></div>
                        <button class="icon-button" data-action="navigate" data-screen="baby">✏️</button>
                    </div>
                    <div class="progress-card">
                        <div class="header"><span>Прогресс</span><span>${introducedCount} / ${totalProducts}</span></div>
                        <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
                    </div>
                    <div class="quick-actions">
                        <button class="quick-action" data-action="add-food"><span>🥣</span><strong>Добавить</strong><small>Записать в дневник</small></button>
                        <button class="quick-action" data-action="navigate" data-screen="products"><span>🥑</span><strong>Продукты</strong><small>База продуктов</small></button>
                        <button class="quick-action" data-action="navigate" data-screen="diary"><span>📖</span><strong>Дневник</strong><small>${STATE.diary.length} записей</small></button>
                        <button class="quick-action" data-action="navigate" data-screen="recipes"><span>🍲</span><strong>Рецепты</strong><small>Идеи</small></button>
                    </div>
                    <div class="empty-state">
                        <div class="empty-icon">🌱</div>
                        <h3>Добро пожаловать!</h3>
                        <p>Начните добавлять продукты и вести дневник.</p>
                    </div>
                </div>
            `;
        }

        function renderProducts() {
            return `
                <div class="screen">
                    <div class="page-header"><h1>Продукты</h1></div>
                    <div class="empty-state">
                        <div class="empty-icon">🥑</div>
                        <h3>База продуктов</h3>
                        <p>Здесь появятся продукты из products.js</p>
                    </div>
                </div>
            `;
        }

        function renderDiary() {
            return `
                <div class="screen">
                    <div class="page-header"><h1>Дневник</h1></div>
                    <div class="empty-state">
                        <div class="empty-icon">📖</div>
                        <h3>Дневник пуст</h3>
                        <p>Добавьте продукты через главный экран.</p>
                    </div>
                </div>
            `;
        }

        function renderRecipes() {
            return `
                <div class="screen">
                    <div class="page-header"><h1>Рецепты</h1></div>
                    <div class="empty-state">
                        <div class="empty-icon">🍲</div>
                        <h3>Рецептов пока нет</h3>
                        <p>Добавьте свои рецепты.</p>
                    </div>
                </div>
            `;
        }

        function renderToday() {
            return `
                <div class="screen">
                    <div class="page-header"><h1>Сегодня</h1></div>
                    <div class="empty-state">
                        <div class="empty-icon">📅</div>
                        <h3>План прикорма</h3>
                        <p>Запланируйте приёмы пищи.</p>
                    </div>
                </div>
            `;
        }

        function renderBaby() {
            const baby = STATE.baby || {};
            return `
                <div class="screen">
                    <div class="page-header"><h1>Малыш</h1></div>
                    <div class="baby-profile-card">
                        <div class="baby-avatar">👶</div>
                        <div><strong>${baby.name || 'Имя не указано'}</strong><br><span class="muted">${calcAge(baby.birthDate)}</span></div>
                        <button class="icon-button" data-action="edit-baby">✏️</button>
                    </div>
                    <div style="padding:12px;background:var(--bg-card);border-radius:var(--radius);margin:12px 0;">
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                            <span class="muted">Тип кормления</span>
                            <span>${baby.feedingType || 'Не указан'}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:8px 0;">
                            <span class="muted">Подход</span>
                            <span>${baby.approach || 'Не выбран'}</span>
                        </div>
                    </div>
                    <button class="danger-button" data-action="reset-data">Сбросить данные</button>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="screen">
                    <div class="page-header"><h1>Настройки</h1></div>
                    <div style="padding:12px;background:var(--bg-card);border-radius:var(--radius);margin:12px 0;">
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);">
                            <span class="muted">Уведомления</span>
                            <span>Включены</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:8px 0;">
                            <span class="muted">Тема</span>
                            <span>Светлая</span>
                        </div>
                    </div>
                    <button class="danger-button" data-action="reset-data">Сбросить данные</button>
                </div>
            `;
        }

        function renderBottomNavigation(active) {
            const items = [
                { id: 'home', icon: '⌂', label: 'Главная' },
                { id: 'products', icon: '🥑', label: 'Продукты' },
                { id: 'today', icon: '📅', label: 'Сегодня' },
                { id: 'diary', icon: '📖', label: 'Дневник' },
                { id: 'baby', icon: '👶', label: 'Малыш' }
            ];
            return `<nav class="bottom-navigation">${items.map(it => `<button class="nav-item ${active === it.id ? 'active' : ''}" data-action="navigate" data-screen="${it.id}"><span>${it.icon}</span><small>${it.label}</small></button>`).join('')}</nav>`;
        }

        function render(screen) {
            const app = document.getElementById('app');
            if (!app) return;
            let html = '';
            switch (screen) {
                case 'home': html = renderHome(); break;
                case 'products': html = renderProducts(); break;
                case 'diary': html = renderDiary(); break;
                case 'recipes': html = renderRecipes(); break;
                case 'today': html = renderToday(); break;
                case 'baby': html = renderBaby(); break;
                case 'settings': html = renderSettings(); break;
                default: html = renderHome();
            }
            app.innerHTML = html + renderBottomNavigation(screen);
            // обработчики кликов
            document.querySelectorAll('[data-action="navigate"]').forEach(btn => {
                btn.addEventListener('click', function() {
                    render(this.dataset.screen);
                });
            });
            document.querySelector('[data-action="reset-data"]')?.addEventListener('click', function(){
                if(confirm('Удалить все данные?')) {
                    localStorage.removeItem('prikorm_app_state');
                    STATE = DEFAULT_STATE;
                    render('home');
                }
            });
            document.querySelector('[data-action="edit-baby"]')?.addEventListener('click', function(){
                const name = prompt('Имя малыша:', STATE.baby.name || '');
                if(name !== null) {
                    STATE.baby.name = name;
                    saveState();
                    render('baby');
                }
            });
            document.querySelector('[data-action="add-food"]')?.addEventListener('click', function(){
                alert('Форма добавления продукта появится в следующей версии');
            });
            // скрываем загрузку
            const ls = document.getElementById('loading-screen');
            if (ls) { ls.classList.add('hidden'); setTimeout(() => ls.style.display = 'none', 600); }
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================
        render('home');
    </script>

    <!-- ERUDA для консоли на телефоне -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
