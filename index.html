<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F8F5F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Прикорм 🌸</title>

    <!-- ===== ПОДКЛЮЧЕНИЕ ШРИФТА (премиальный Nunito) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="styles/main.css?v=2.1.25">
    <link rel="stylesheet" href="styles/welcome.css?v=2.1.25"> <!-- НОВЫЙ CSS ДЛЯ SPLASH -->
</head>
<body>
    <!-- ===== ЗАГРУЗОЧНЫЙ ЭКРАН (пока загружаются скрипты) ===== -->
    <div id="loading-screen">
        <div class="splash-content">
            <div class="splash-emoji">🌸</div>
            <h1 class="splash-title">Прикорм</h1>
            <div class="splash-subtitle">С заботой о малыше</div>
            <div class="splash-loader"></div>
            <div class="splash-text">Загрузка...</div>
        </div>
    </div>

    <!-- ===== СТАРТОВЫЙ ЭКРАН (SPLASH) – показывается после загрузки приложения ===== -->
    <div id="splash-screen" style="display:none;">
        <div class="welcome-content">
            <div class="welcome-icon">🥄</div>
            <div class="welcome-title">PRIKORM.BOT</div>
            <div class="welcome-subtitle">Прикорм без паники</div>
            <div class="welcome-desc">Понятно. По возрасту. С заботой о малыше.</div>
            <button class="welcome-btn" id="start-app-btn">Начать</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div id="app" style="display:none;"></div>

    <!-- ===== ПРИВЕТСТВЕННЫЙ ЭКРАН ДЛЯ ПЕРВОГО ЗАПУСКА (не путать со стартовым) ===== -->
    <div id="welcome-screen" style="display:none;">
        <div class="welcome-content">
            <div class="welcome-emoji">🌸</div>
            <h1 class="welcome-title">Прикорм</h1>
            <p class="welcome-subtitle">Поможем начать прикорм с заботой и вниманием</p>
            <p class="welcome-desc">Ответьте на несколько вопросов о малыше, и мы подскажем, с чего начать.</p>
            <button class="welcome-btn" id="start-onboarding-btn">🌱 Начать знакомство</button>
        </div>
    </div>

    <!-- ============================================================
         ПОДКЛЮЧЕНИЕ СКРИПТОВ С ВЕРСИЕЙ 2.1.25
         ============================================================ -->
    <!-- Корневые файлы -->
    <script src="config.js?v=2.1.25"></script>
    <script src="utils.js?v=2.1.25"></script>

    <!-- СЕРВИСЫ -->
    <script src="services/storage-service.js?v=2.1.25"></script>
    <script src="services/child-service.js?v=2.1.25"></script>
    <script src="services/feeding-readiness-service.js?v=2.1.25"></script>

    <script src="state.js?v=2.1.25"></script>
    <script src="ui.js?v=2.1.25"></script>
    <script src="updater.js?v=2.1.25"></script>
    <script src="theme.js?v=2.1.25"></script>
    <script src="handlers.js?v=2.1.25"></script>

    <script src="data/products.js?v=2.1.25"></script>
    <script src="data/recipes.js?v=2.1.25"></script>
    <script src="data/safety.js?v=2.1.25"></script>
    <script src="data/recommendations.js?v=2.1.25"></script>

    <script src="components/header.js?v=2.1.25"></script>
    <script src="components/bottom-nav.js?v=2.1.25"></script>
    <script src="components/product-card.js?v=2.1.25"></script>
    <script src="components/recipe-card.js?v=2.1.25"></script>
    <script src="components/modal.js?v=2.1.25"></script>
    <script src="components/toast.js?v=2.1.25"></script>

    <script src="screens/rendering.js?v=2.1.25"></script>
    <script src="screens/home.js?v=2.1.25"></script>
    <script src="screens/products.js?v=2.1.25"></script>
    <script src="screens/today.js?v=2.1.25"></script>
    <script src="screens/diary.js?v=2.1.25"></script>
    <script src="screens/recipes.js?v=2.1.25"></script>
    <script src="screens/baby.js?v=2.1.25"></script>
    <script src="screens/settings.js?v=2.1.25"></script>
    <script src="screens/onboarding.js?v=2.1.25"></script>

    <script src="app.js?v=2.1.25"></script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <!-- ============================================================
         ЗАПУСК ПРИЛОЖЕНИЯ (с управлением splash-экраном)
         ============================================================ -->
    <script>
        (function() {
            // Функция скрытия загрузочного экрана
            function hideLoading() {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('hidden');
                    setTimeout(function() {
                        ls.style.display = 'none';
                    }, 600);
                }
            }

            // Функция показа стартового экрана (splash)
            function showSplash() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.display = 'flex';
                    // Плавное появление
                    setTimeout(function() {
                        splash.classList.add('visible');
                    }, 50);
                }
            }

            // Функция скрытия стартового экрана и показа приложения
            function hideSplashAndShowApp() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.remove('visible');
                    splash.classList.add('hiding');
                    setTimeout(function() {
                        splash.style.display = 'none';
                        // Показываем приложение
                        var app = document.getElementById('app');
                        if (app) {
                            app.style.display = 'block';
                            // Если приложение уже отрендерилось, скрывать не нужно
                        }
                        // Удаляем класс hiding для возможности повторного показа
                        splash.classList.remove('hiding');
                    }, 400);
                } else {
                    // Если splash нет, сразу показываем app
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            }

            // Основная функция запуска
            function startApp() {
                console.log('🚀 Запуск приложения...');
                // Запускаем существующее приложение (рендеринг)
                if (typeof startApplication === 'function') {
                    startApplication();
                } else if (typeof initApp === 'function') {
                    initApp();
                } else if (typeof render === 'function') {
                    render();
                } else {
                    console.warn('⚠️ Не найдена функция запуска приложения!');
                }

                // Скрываем загрузочный экран (спиннер)
                hideLoading();

                // Показываем стартовый экран (splash)
                showSplash();

                // Приложение уже отрендерилось, но скрыто (display:none).
                // После нажатия кнопки мы покажем его.
            }

            // Обработчик кнопки «Начать»
            document.addEventListener('DOMContentLoaded', function() {
                var startBtn = document.getElementById('start-app-btn');
                if (startBtn) {
                    startBtn.addEventListener('click', function() {
                        hideSplashAndShowApp();
                    });
                } else {
                    // Если кнопки нет, возможно, splash не нужен — показываем приложение сразу
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            });

            // Запускаем приложение, когда DOM готов
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startApp);
            } else {
                startApp();
            }
        })();
    </script>
</body>
</html>
