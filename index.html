<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F8F5F1">
    <title>Прикорм — диагностика</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Roboto,sans-serif;background:#f5f0eb;display:flex;justify-content:center;padding:16px;min-height:100vh}
        #app{max-width:480px;width:100%;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        h1{font-size:24px;margin-bottom:12px;color:#2d1f14}
        .log-entry{padding:6px 0;border-bottom:1px solid #f0ebe7;font-size:14px;line-height:1.4}
        .ok{color:#2e7d32}
        .error{color:#c62828;font-weight:bold}
        .warn{color:#f57c00}
        .info{color:#1976d2}
        #status{margin:16px 0;padding:12px;border-radius:8px;font-weight:bold;background:#f5f5f5}
        .success{background:#e8f5e9;color:#2e7d32}
        .fail{background:#ffebee;color:#c62828}
        .spinner{display:inline-block;width:20px;height:20px;border:3px solid #ddd;border-top-color:#d4a373;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:10px}
        @keyframes spin{to{transform:rotate(360deg)}}
        button{margin-top:12px;padding:10px 20px;background:#d4a373;border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;width:100%}
    </style>
</head>
<body>
    <div id="app">
        <h1>🔍 Диагностика приложения</h1>
        <div id="log"></div>
        <div id="status">⏳ Загрузка...</div>
        <button id="reloadBtn">🔄 Перезагрузить (сброс кэша)</button>
    </div>

    <script>
        // ============================================================
        // 1. Логгер на экран
        // ============================================================
        const logDiv = document.getElementById('log');
        const statusDiv = document.getElementById('status');

        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = msg;
            logDiv.appendChild(entry);
            console.log(msg);
        }

        function setStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            statusDiv.className = isError ? 'fail' : 'success';
        }

        // Перехват ошибок
        window.onerror = function(message, source, line, col, error) {
            log('❌ ОШИБКА: ' + message + ' (в ' + source + ' строка ' + line + ')', 'error');
            setStatus('❌ Ошибка!', true);
            return true;
        };

        log('🚀 Начинаем диагностику', 'info');

        // ============================================================
        // 2. Загрузка скриптов с индикацией (обновлён список)
        // ============================================================
        const FILES = [
            { src: 'config.js', label: 'config.js' },
            { src: 'data/products.js', label: 'data/products.js' },
            { src: 'data/recipes.js', label: 'data/recipes.js' },
            { src: 'data/safety.js', label: 'data/safety.js' },
            { src: 'data/recommendations.js', label: 'data/recommendations.js' },
            { src: 'utils.js', label: 'utils.js' },
            { src: 'state.js', label: 'state.js' },
            { src: 'rendering.js', label: 'rendering.js' },
            // --- Экраны из папки screens/ ---
            { src: 'screens/home.js', label: 'screens/home.js' },
            { src: 'screens/products.js', label: 'screens/products.js' },
            { src: 'screens/today.js', label: 'screens/today.js' },
            // --- Остальные (пока в корне) ---
            { src: 'diary.js', label: 'diary.js' },
            { src: 'onboarding.js', label: 'onboarding.js' },
            { src: 'ui.js', label: 'ui.js' },
            // --- Обработчики и темы ---
            { src: 'handlers.js', label: 'handlers.js' },
            { src: 'theme.js', label: 'theme.js' },
            { src: 'app.js', label: 'app.js' }
        ];

        let loaded = 0;
        const total = FILES.length;

        function loadScript(index) {
            if (index >= total) {
                log('✅ Все файлы загружены', 'ok');
                checkState();
                return;
            }
            const file = FILES[index];
            log('⏳ Загрузка: ' + file.label, 'info');
            const script = document.createElement('script');
            script.src = file.src;
            script.onload = function() {
                log('✅ ' + file.label + ' загружен', 'ok');
                loaded++;
                loadScript(index + 1);
            };
            script.onerror = function() {
                log('❌ ' + file.label + ' НЕ ЗАГРУЗИЛСЯ (404)', 'error');
                loaded++;
                loadScript(index + 1);
            };
            document.head.appendChild(script);
        }

        // ============================================================
        // 3. Проверка состояния после загрузки
        // ============================================================
        function checkState() {
            const hasProducts = typeof window.PRODUCTS !== 'undefined';
            const productsLength = hasProducts ? window.PRODUCTS.length : 0;
            const hasRecipes = typeof window.RECIPES !== 'undefined';
            const recipesLength = hasRecipes ? window.RECIPES.length : 0;
            const hasState = typeof window.STATE !== 'undefined';

            log('', 'info');
            log('📊 Проверка глобальных переменных:', 'info');
            log('   window.PRODUCTS: ' + (hasProducts ? '✅ есть, длина ' + productsLength : '❌ НЕТ'), hasProducts ? 'ok' : 'error');
            log('   window.RECIPES: ' + (hasRecipes ? '✅ есть, длина ' + recipesLength : '❌ НЕТ'), hasRecipes ? 'ok' : 'error');
            log('   window.STATE: ' + (hasState ? '✅ есть' : '❌ НЕТ'), hasState ? 'ok' : 'error');

            if (hasProducts && productsLength > 0) {
                setStatus('✅ Всё загружено! Продуктов: ' + productsLength);
                // Попытка запустить приложение через существующие функции
                if (typeof window.render === 'function') {
                    log('🚀 Запускаем render("home")', 'info');
                    window.render('home');
                } else if (typeof window.initApp === 'function') {
                    log('🚀 Запускаем initApp()', 'info');
                    window.initApp();
                } else {
                    log('⚠️ render или initApp не найдены', 'warn');
                }
            } else {
                setStatus('❌ Проблема: продукты не загружены', true);
                log('⚠️ Проверьте, что файл data/products.js существует и содержит window.PRODUCTS = PRODUCTS;', 'warn');
                log('💡 Возможно, файл называется data_products.js — переименуйте в data/products.js', 'info');
                log('💡 Или в index.html указан неправильный путь', 'info');
            }
        }

        // ============================================================
        // 4. Запуск загрузки
        // ============================================================
        loadScript(0);

        // ============================================================
        // 5. Таймаут для защиты от зависания
        // ============================================================
        setTimeout(function() {
            if (loaded < total) {
                log('⏳ Загрузка затянулась... Проверьте подключение или пути к файлам', 'warn');
                setStatus('⏳ Медленное соединение или ошибка пути', false);
            }
        }, 5000);

        // ============================================================
        // 6. Кнопка перезагрузки с очисткой кэша
        // ============================================================
        document.getElementById('reloadBtn').addEventListener('click', function() {
            // Очищаем localStorage и sessionStorage
            try {
                localStorage.clear();
                sessionStorage.clear();
            } catch(e) {}
            // Перезагружаем с параметром, чтобы обойти кэш
            location.href = location.pathname + '?v=' + Date.now();
        });
    </script>
</body>
</html>
