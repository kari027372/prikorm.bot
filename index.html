<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFF7F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>KENORA – прикорм без паники</title>

    <!-- ===== ПОДКЛЮЧЕНИЕ ШРИФТОВ ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="styles/main.css?v=2.1.26">
    <link rel="stylesheet" href="styles/welcome.css?v=2.1.26">
</head>
<body>
    <!-- ===== ЗАГРУЗОЧНЫЙ ЭКРАН (пока загружаются скрипты) ===== -->
    <div id="loading-screen">
        <div class="splash-content">
            <div class="splash-emoji">🌸</div>
            <h1 class="splash-title">KENORA</h1>
            <div class="splash-subtitle">прикорм без паники</div>
            <div class="splash-loader"></div>
            <div class="splash-text">Загрузка...</div>
        </div>
    </div>

    <!-- ===== СТАРТОВЫЙ ЭКРАН (SPLASH) – НОВЫЙ ДИЗАЙН ===== -->
    <div id="splash-screen" style="display:none;">
        <div class="splash-container">
            <!-- Этап 1: символ "O" с ложечкой и листиком -->
            <div class="splash-logo-wrapper">
                <svg class="splash-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Буква O (контур) -->
                    <circle cx="60" cy="60" r="48" stroke="#EB87B7" stroke-width="3" opacity="0"/>
                    <!-- Ложечка внутри -->
                    <path d="M60 36 L60 52" stroke="#A76BA6" stroke-width="3" stroke-linecap="round" opacity="0"/>
                    <circle cx="60" cy="34" r="4" fill="#A76BA6" opacity="0"/>
                    <!-- Листик -->
                    <path d="M60 54 C66 54 70 58 70 64 C70 70 66 74 60 74 C54 74 50 70 50 64 C50 58 54 54 60 54Z" fill="#C7D6C7" opacity="0"/>
                    <path d="M60 54 L60 74" stroke="#A76BA6" stroke-width="1.5" opacity="0"/>
                </svg>
            </div>

            <!-- Этап 2: буквы K ENORA -->
            <div class="splash-brand">
                <span class="splash-brand-letter" style="animation-delay: 0.3s;">K</span>
                <span class="splash-brand-letter" style="animation-delay: 0.5s;">E</span>
                <span class="splash-brand-letter" style="animation-delay: 0.7s;">N</span>
                <span class="splash-brand-letter" style="animation-delay: 0.9s;">O</span>
                <span class="splash-brand-letter" style="animation-delay: 1.1s;">R</span>
                <span class="splash-brand-letter" style="animation-delay: 1.3s;">A</span>
            </div>

            <!-- Этап 3: подзаголовок -->
            <div class="splash-subtitle">прикорм без паники</div>

            <!-- Этап 4: маленький листик внизу -->
            <div class="splash-leaf"></div>

            <button class="splash-btn" id="start-app-btn">Начать</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div id="app" style="display:none;"></div>

    <!-- ===== ПРИВЕТСТВЕННЫЙ ЭКРАН ДЛЯ ПЕРВОГО ЗАПУСКА ===== -->
    <div id="welcome-screen" style="display:none;">
        <div class="welcome-content">
            <div class="welcome-emoji">🌸</div>
            <h1 class="welcome-title">KENORA</h1>
            <p class="welcome-subtitle">прикорм без паники</p>
            <p class="welcome-desc">Ответьте на несколько вопросов о малыше, и мы подскажем, с чего начать.</p>
            <button class="welcome-btn" id="start-onboarding-btn">🌱 Начать знакомство</button>
        </div>
    </div>

    <!-- ============================================================
         ПОДКЛЮЧЕНИЕ СКРИПТОВ (версия 2.1.26)
         ============================================================ -->
    <script src="config.js?v=2.1.26"></script>
    <script src="utils.js?v=2.1.26"></script>
    <script src="services/storage-service.js?v=2.1.26"></script>
    <script src="services/child-service.js?v=2.1.26"></script>
    <script src="services/feeding-readiness-service.js?v=2.1.26"></script>
    <script src="state.js?v=2.1.26"></script>
    <script src="ui.js?v=2.1.26"></script>
    <script src="updater.js?v=2.1.26"></script>
    <script src="theme.js?v=2.1.26"></script>
    <script src="handlers.js?v=2.1.26"></script>
    <script src="data/products.js?v=2.1.26"></script>
    <script src="data/recipes.js?v=2.1.26"></script>
    <script src="data/safety.js?v=2.1.26"></script>
    <script src="data/recommendations.js?v=2.1.26"></script>
    <script src="components/header.js?v=2.1.26"></script>
    <script src="components/bottom-nav.js?v=2.1.26"></script>
    <script src="components/product-card.js?v=2.1.26"></script>
    <script src="components/recipe-card.js?v=2.1.26"></script>
    <script src="components/modal.js?v=2.1.26"></script>
    <script src="components/toast.js?v=2.1.26"></script>
    <script src="screens/rendering.js?v=2.1.26"></script>
    <script src="screens/home.js?v=2.1.26"></script>
    <script src="screens/products.js?v=2.1.26"></script>
    <script src="screens/today.js?v=2.1.26"></script>
    <script src="screens/diary.js?v=2.1.26"></script>
    <script src="screens/recipes.js?v=2.1.26"></script>
    <script src="screens/baby.js?v=2.1.26"></script>
    <script src="screens/settings.js?v=2.1.26"></script>
    <script src="screens/onboarding.js?v=2.1.26"></script>
    <script src="app.js?v=2.1.26"></script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <!-- ============================================================
         ЗАПУСК ПРИЛОЖЕНИЯ
         ============================================================ -->
    <script>
        (function() {
            function hideLoading() {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('hidden');
                    setTimeout(function() {
                        ls.style.display = 'none';
                    }, 600);
                }
            }

            function showSplash() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.display = 'flex';
                    setTimeout(function() {
                        splash.classList.add('visible');
                    }, 50);
                }
            }

            function hideSplashAndShowApp() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.remove('visible');
                    splash.classList.add('hiding');
                    setTimeout(function() {
                        splash.style.display = 'none';
                        var app = document.getElementById('app');
                        if (app) app.style.display = 'block';
                        splash.classList.remove('hiding');
                    }, 400);
                } else {
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            }

            function startApp() {
                console.log('🚀 Запуск KENORA...');
                if (typeof startApplication === 'function') {
                    startApplication();
                } else if (typeof initApp === 'function') {
                    initApp();
                } else if (typeof render === 'function') {
                    render();
                } else {
                    console.warn('⚠️ Не найдена функция запуска приложения!');
                }
                hideLoading();
                showSplash();
            }

            document.addEventListener('DOMContentLoaded', function() {
                var startBtn = document.getElementById('start-app-btn');
                if (startBtn) {
                    startBtn.addEventListener('click', function() {
                        hideSplashAndShowApp();
                    });
                } else {
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startApp);
            } else {
                startApp();
            }
        })();
    </script>
</body>
</html>
