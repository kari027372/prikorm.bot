        .progress-card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.04)}

        .progress-card .eyebrow{font-size:11px;color:#b0978a;text-transform:uppercase}

        .progress-number{font-size:20px;font-weight:700;color:#d4a373}
        .progress-track{background:#f0ebe7;height:8px;border-radius:10px;margin:8px 0;overflow:hidden}

        .search-box span{font-size:18px;margin-right:8px}
        .tabs{display:flex;gap:6px;margin:12px 0}
        .tab-button{background:#f0ebe7;border:none;padding:8px 16px;border-radius:30px;font-size:14px;cursor:pointer;transition:.2s}
        .tab-button.active{background:#d4a373;color:#fff}
        .category-scroll{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;-webkit-overflow-scrolling:touch}

function calcAge(birthDate) {
    if (!birthDate) return { months:0, days:0 };
    const birth = new Date(birthDate);
    const today = new Date();
    let months = (today.getFullYear() - birth.getFullYear()) * 12 + (today.getMonth() - birth.getMonth());
    if (today.getDate() < birth.getDate()) months--;
    months = Math.max(0, months);
    const monthStart = new Date(birth); monthStart.setMonth(birth.getMonth() + months);
    const days = Math.max(0, Math.floor((today - monthStart) / 86400000));
    return { months, days };
}
function getMinAge(feedingType) { return APP_CONFIG.minAgeByFeeding?.[feedingType] || 6; }
function getStage(days) {
    if (!APP_CONFIG.stages) return { id:'знакомство', label:'Знакомство', days:1, meals:1 };
    let current = { id:'подготовка', days:0, label:'Подготовка', meals:0 };
    for (const [id, stage] of Object.entries(APP_CONFIG.stages)) {
        if (days >= stage.days) current = { ...stage, id };
    }
    return current;
}
function getPrikormDays(profile) {
    const start = profile?.prikormStartDate || profile?.prikorm_start_date;
    if (!start) return 0;
    return Math.max(0, Math.floor((new Date() - new Date(start)) / 86400000));
}
function getTextureStage(ageMonths, prikormDays) {
    if (ageMonths < 6) return { id:'puree', title:'Однородная текстура', description:'Текстура подбирается индивидуально с учётом готовности ребёнка.' };

    if (ageMonths < 10) return { id:'mashed', title:'Мягкая размятая пища', description:'Можно постепенно расширять текстуры и мягкие кусочки.' };
    return { id:'family_adapted', title:'Разнообразные текстуры', description:'Пища может становиться более разнообразной по форме и текстуре.' };
}

function getAvailableProducts(profile, products) {
    const p = profile || STATE?.baby || {};

}

const stateListeners = [];

function getPlanForDate(dateStr) {
    if (!STATE.plan) STATE.plan = { days: {} };
    if (!STATE.plan.days) STATE.plan.days = {};
    return STATE.plan.days[dateStr] || [];
}
function setPlanForDate(dateStr, meals) {
    if (!STATE.plan) STATE.plan = { days: {} };
    if (!STATE.plan.days) STATE.plan.days = {};
    STATE.plan.days[dateStr] = Array.isArray(meals) ? meals : [];
    saveState();
    emitStateChange();
}
function addMealToPlan(dateStr, meal) {
    const plan = getPlanForDate(dateStr);
    plan.push(meal);
    setPlanForDate(dateStr, plan);
}
function removeMealFromPlan(dateStr, index) {
    const plan = getPlanForDate(dateStr);
    if (index >= 0 && index < plan.length) {
        plan.splice(index, 1);
        setPlanForDate(dateStr, plan);
    }
}
function renderDailyPlan(dateStr) { render('today'); }

// ============================================================
// 10. ТЕМА
// ============================================================
function getTheme() { return localStorage.getItem('prikorm_theme') || 'light'; }
function setTheme(theme) {
    document.body.classList.remove('theme-dark', 'theme-kids');
    if (theme === 'dark') document.body.classList.add('theme-dark');
    else if (theme === 'kids') document.body.classList.add('theme-kids');
    localStorage.setItem('prikorm_theme', theme);
}
function initTheme() { setTheme(getTheme()); }

// ============================================================
// 11. ХЭНДЛЕРЫ
// ============================================================
function setupEventListeners() {
    document.addEventListener('click', function(e) {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;
        switch(action) {
            case 'navigate':
                const screen = target.dataset.screen;
                if (screen) showScreen(screen);
                break;
            case 'product-category':
                const cat = target.dataset.category;
                window.CURRENT_PRODUCT_CATEGORY = cat;
                render('products');
                break;
            case 'open-product':
                const pid = target.dataset.productId;
                if (pid) {
                    const product = PRODUCTS.find(p => p.id === pid);
                    if (product) showToast('Выбран продукт: ' + product.name, 'success');
                }
                break;
            case 'add-diary':
            case 'add-food':
                openAddFoodModal();
                break;
            case 'edit-baby':
                const name = prompt('Имя малыша:', STATE.baby.name || '');
                if (name !== null) {
                    const birth = prompt('Дата рождения (ГГГГ-ММ-ДД):', STATE.baby.birthDate || '');
                    if (birth !== null) {
                        const age = birth ? calcAge(birth) : { months:0, days:0 };
                        updateBaby({ name, birthDate: birth, feedingType: STATE.baby.feedingType || 'ГВ', ageMonths: age.months, ageDays: age.days });
                        render('baby');
                        showToast('Профиль сохранён', 'success');
                    }
                }
                break;
            case 'settings':
                const setting = target.dataset.setting;
                if (setting === 'notifications') {
                    updateState(s => { s.settings.notifications = !s.settings.notifications; });
                    showToast(STATE.settings.notifications ? 'Уведомления включены' : 'Уведомления выключены', 'success');
                } else if (setting === 'theme') {
                    const current = getTheme();
                    const next = current === 'light' ? 'dark' : current === 'dark' ? 'kids' : 'light';
                    setTheme(next);
                    showToast('Тема: ' + next, 'success');
                } else {
                    showToast('Настройка в разработке', 'default');
                }
                break;
            case 'reset-data':
                if (confirm('Удалить все данные?')) {
                    resetState();
                    render('home');
                    showToast('Данные удалены', 'success');
                }
                break;
            case 'previous-day':
                window.CURRENT_DATE = window.CURRENT_DATE || new Date();
                window.CURRENT_DATE.setDate(window.CURRENT_DATE.getDate() - 1);
                render('today');
                break;
            case 'next-day':
                window.CURRENT_DATE = window.CURRENT_DATE || new Date();
                window.CURRENT_DATE.setDate(window.CURRENT_DATE.getDate() + 1);
                render('today');
                break;
            case 'add-meal':
                const mealName = prompt('Название приёма пищи:', 'Завтрак');
                if (mealName) {
                    const dateStr = new Date().toISOString().slice(0,10);
                    addMealToPlan(dateStr, { name: mealName, products: [] });
                    render('today');
                    showToast('Приём пищи добавлен', 'success');
                }
                break;
            case 'remove-meal':
                const idx = parseInt(target.dataset.index);
                const dateStr2 = new Date().toISOString().slice(0,10);
                if (!isNaN(idx)) {
                    removeMealFromPlan(dateStr2, idx);
                    render('today');
                }
                break;
        }
    });
    document.addEventListener('input', function(e) {
        if (e.target.id === 'product-search') {
            window.CURRENT_PRODUCT_SEARCH = e.target.value.toLowerCase();
            render('products');
        }
    });
}

// ============================================================
// 12. ЗАПУСК
// ============================================================
function initApp() {
    console.log('🌸 Запуск приложения...');
    buildApp();
    loadState();
    initTheme();
    setupEventListeners();
    const initialScreen = STATE?.ui?.screen || 'home';
    render(initialScreen);
    console.log('✅ Приложение запущено');
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
} else {
    initApp();
}
</script>
