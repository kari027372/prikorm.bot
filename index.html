<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Прикорм — отладка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f0eb;display:flex;justify-content:center;padding:10px}
#app{max-width:480px;width:100%;background:#fff;border-radius:20px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.error-box{background:#ffe0e0;border-left:4px solid #c00;padding:12px;margin:12px 0;border-radius:8px}
.error-box strong{color:#c00}
.log-box{background:#f0f0f0;padding:12px;border-radius:8px;font-size:13px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all}
button{padding:12px 20px;border:none;border-radius:12px;background:#d4a373;color:#fff;font-weight:600;cursor:pointer;margin:8px 0;width:100%}
button.danger{background:#c62828}
h2{margin:16px 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// ОТЛАДОЧНАЯ СТРАНИЦА – ПОКАЗЫВАЕТ ОШИБКИ И СОСТОЯНИЕ
// ============================================================

const app = document.getElementById('app');

// Перехват всех ошибок
window.onerror = function(msg, source, line, col, error) {
    showError(msg + (error ? ' (подробнее в консоли)' : ''));
    return true;
};

// Функция показа ошибки на экране
function showError(msg) {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-box';
    errorDiv.innerHTML = `<strong>⚠️ Ошибка:</strong> ${msg}`;
    app.prepend(errorDiv);
}

// Функция вывода лога
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    if (!logDiv) return;
    const p = document.createElement('div');
    p.style.color = type === 'error' ? 'red' : type === 'ok' ? 'green' : '#333';
    p.textContent = msg;
    logDiv.appendChild(p);
    console.log(msg);
}

// Функция принудительной очистки
function resetAndReload() {
    localStorage.removeItem('prikorm_app_state');
    location.reload();
}

// ============================================================
// ЗАГРУЗКА СОСТОЯНИЯ С НОРМАЛИЗАЦИЕЙ
// ============================================================
const DEFAULT_STATE = {
    baby: { name: '', birthDate: '', feedingType: 'ГВ', feedingStarted: false, feedingStartDate: '', approach: 'mixed' },
    diary: [],
    introduced: [],
    favorites: [],
    reactions: [],
    settings: { theme: 'light' },
    onboardingCompleted: false
};

let STATE;
try {
    const saved = localStorage.getItem('prikorm_app_state');
    if (saved) {
        const parsed = JSON.parse(saved);
        STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
        // Копируем только существующие поля
        for (const key in parsed) {
            if (key !== 'baby' && DEFAULT_STATE.hasOwnProperty(key)) {
                STATE[key] = parsed[key];
            }
        }
        if (parsed.baby) {
            STATE.baby = { ...STATE.baby, ...parsed.baby };
        }
        // Гарантируем массивы
        if (!Array.isArray(STATE.introduced)) STATE.introduced = [];
        if (!Array.isArray(STATE.diary)) STATE.diary = [];
        if (!Array.isArray(STATE.favorites)) STATE.favorites = [];
        if (!Array.isArray(STATE.reactions)) STATE.reactions = [];
    } else {
        STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
} catch(e) {
    showError('Ошибка чтения сохранённых данных: ' + e.message);
    STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
}

// Функция сохранения
function saveState() {
    try {
        localStorage.setItem('prikorm_app_state', JSON.stringify(STATE));
    } catch(e) {
        showError('Ошибка сохранения: ' + e.message);
    }
}

// ============================================================
// ОТОБРАЖЕНИЕ ИНТЕРФЕЙСА
// ============================================================
function render() {
    try {
        // Проверяем, что STATE.introduced – массив
        if (!Array.isArray(STATE.introduced)) {
            STATE.introduced = [];
            saveState();
            log('⚠️ STATE.introduced был исправлен (был не массивом)', 'error');
        }

        app.innerHTML = `
            <h1>🌸 Прикорм — отладка</h1>
            <div id="log" class="log-box"></div>
            <div style="margin-top:16px;">
                <button onclick="resetAndReload()">🗑️ Очистить данные и перезагрузить</button>
                <button onclick="location.reload()">🔄 Перезагрузить страницу</button>
            </div>
            <h2>📦 Текущее состояние</h2>
            <pre style="background:#f5f5f5;padding:12px;border-radius:8px;font-size:12px;overflow:auto;max-height:300px;">${JSON.stringify(STATE, null, 2)}</pre>
            <h2>📋 Введённые продукты (${STATE.introduced.length})</h2>
            <ul>${STATE.introduced.map(id => `<li>${id}</li>`).join('')}</ul>
            <h2>📖 Дневник (${STATE.diary.length} записей)</h2>
            <ul>${STATE.diary.map(e => `<li>${e.product} — ${e.date}</li>`).join('')}</ul>
            <button onclick="resetAndReload()" class="danger">⚠️ Сбросить всё и начать заново</button>
        `;

        log('✅ Отладка загружена', 'ok');
        log(`📌 STATE.introduced: ${Array.isArray(STATE.introduced) ? 'массив, длина ' + STATE.introduced.length : 'НЕ МАССИВ!'}`, 'ok');
        log(`📌 STATE.diary: ${Array.isArray(STATE.diary) ? 'массив, длина ' + STATE.diary.length : 'НЕ МАССИВ!'}`, 'ok');
        log('📌 Состояние успешно загружено. Если ошибка, нажмите "Очистить данные".');

        // Если есть ошибка, показываем её в логе
        if (!Array.isArray(STATE.introduced)) {
            log('❌ КРИТИЧЕСКАЯ ОШИБКА: STATE.introduced не является массивом!', 'error');
        }
    } catch(e) {
        showError('Ошибка в render(): ' + e.message);
        app.innerHTML = `
            <h1>❌ Критическая ошибка</h1>
            <div class="error-box"><strong>${e.message}</strong><br>${e.stack}</div>
            <button onclick="resetAndReload()">🗑️ Очистить данные и перезагрузить</button>
        `;
    }
}

// ============================================================
// ЗАПУСК
// ============================================================
render();
</script>
</body>
</html>
