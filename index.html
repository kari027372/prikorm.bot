    <!-- ===== СТАРТОВЫЙ ЭКРАН (SPLASH) – обновлён ===== -->

        <div class="welcome-content">

                <path d="M28 38 L28 48 C28 52 32 56 36 56 L44 56 C48 56 52 52 52 48 L52 38" stroke="#d4b8a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M32 44 L48 44" stroke="#d4b8a0" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M36 48 L44 48" stroke="#d4b8a0" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M40 24 L40 32" stroke="#d4b8a0" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M40 32 L42 35 L40 38 L38 35 L40 32Z" fill="#d4b8a0"/>
                <circle cx="40" cy="26" r="2.5" fill="#d4b8a0"/>
                <path d="M56 28 L60 24 L64 28 L60 32 L56 28Z" fill="#d4b8a0" opacity="0.6"/>
                <path d="M54 30 L58 26 L62 30" stroke="#d4b8a0" stroke-width="1.5" stroke-linecap="round"/>
            </svg>

            <div class="welcome-title">Прикорм</div>
            <div class="welcome-subtitle">Без паники</div>
            <div class="welcome-desc">Понятно. По возрасту. С заботой о малыше.</div>
            <button class="welcome-btn" id="start-app-btn">Начать</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div id="app" style="display:none;"></div>

    <!-- ===== ПРИВЕТСТВЕННЫЙ ЭКРАН ДЛЯ ПЕРВОГО ЗАПУСКА (не путать со стартовым) ===== -->
    <div id="welcome-screen" style="display:none;">
        <div class="welcome-content">
            <div class="welcome-emoji">🌸</div>
            <h1 class="welcome-title">Прикорм</h1>
            <p class="welcome-subtitle">Поможем начать прикорм с заботой и вниманием</p>
            <p class="welcome-desc">Ответьте на несколько вопросов о малыше, и мы подскажем, с чего начать.</p>
            <button class="welcome-btn" id="start-onboarding-btn">🌱 Начать знакомство</button>
        </div>
    </div>

    <!-- ============================================================
         ПОДКЛЮЧЕНИЕ СКРИПТОВ С ВЕРСИЕЙ 2.1.25
         ============================================================ -->

    <script src="components/header.js?v=2.1.25"></script>

    <script>eruda.init();</script>

    <!-- ============================================================
         ЗАПУСК ПРИЛОЖЕНИЯ (с управлением splash-экраном)
         ============================================================ -->
    <script>
        (function() {
            function hideLoading() {
                var ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('hidden');
                    setTimeout(function() {
                        ls.style.display = 'none';
                    }, 600);
                }
            }

            function showSplash() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.display = 'flex';
                    setTimeout(function() {
                        splash.classList.add('visible');
                    }, 50);
                }
            }

            function hideSplashAndShowApp() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.remove('visible');
                    splash.classList.add('hiding');
                    setTimeout(function() {
                        splash.style.display = 'none';
                        var app = document.getElementById('app');
                        if (app) {
                            app.style.display = 'block';
                        }
                        splash.classList.remove('hiding');
                    }, 400);
                } else {
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            }

            function startApp() {
                console.log('🚀 Запуск приложения...');
                if (typeof startApplication === 'function') {
                    startApplication();
                } else if (typeof initApp === 'function') {
                    initApp();
                } else if (typeof render === 'function') {
                    render();
                } else {
                    console.warn('⚠️ Не найдена функция запуска приложения!');
                }
                hideLoading();
                showSplash();
            }

            document.addEventListener('DOMContentLoaded', function() {
                var startBtn = document.getElementById('start-app-btn');
                if (startBtn) {
                    startBtn.addEventListener('click', function() {
                        hideSplashAndShowApp();
                    });
                } else {
                    var app = document.getElementById('app');
                    if (app) app.style.display = 'block';
                }
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startApp);
            } else {
                startApp();
            }
        })();
    </script>
</body>
</html>
