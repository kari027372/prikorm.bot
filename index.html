<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f8f4f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Прикорм 🌸</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f8f4f0; padding:16px; padding-bottom:80px; color:#2c2c2c; }
        .container { max-width:450px; margin:0 auto; }
        .card { background:#fff; border-radius:20px; padding:18px 16px; margin-bottom:16px; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid #efe8e0; }
        .card h2 { font-size:17px; font-weight:600; margin-bottom:10px; }
        .sub { color:#7a6e66; font-size:14px; line-height:1.5; }
        .btn { display:block; width:100%; padding:14px; background:#e8a87c; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:500; cursor:pointer; }
        .btn:active { background:#d4916b; }
        .btn-outline { background:transparent; color:#e8a87c; border:1.5px solid #e8a87c; }
        .btn-danger { background:transparent; color:#d44a4a; border:1.5px solid #d44a4a; }
        .input-group { margin-bottom:14px; }
        .input-group label { display:block; font-size:14px; color:#7a6e66; margin-bottom:4px; }
        .input-group input, .input-group select { width:100%; padding:10px 14px; border:1px solid #efe8e0; border-radius:12px; font-size:16px; background:#faf6f0; }
        .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #efe8e0; }
        .row:last-child { border-bottom:none; }
        .label { color:#7a6e66; font-size:14px; }
        .value { font-weight:500; font-size:14px; }
        .bottom-nav { display:flex; justify-content:space-around; background:#fff; border-top:1px solid #efe8e0; padding:8px 0; position:fixed; bottom:0; left:0; right:0; z-index:100; backdrop-filter:blur(8px); }
        .bottom-nav .tab { background:none; border:none; font-size:10px; color:#b0a69e; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; flex:1; }
        .bottom-nav .tab.active { color:#e8a87c; }
        .bottom-nav .tab .icon { font-size:22px; }
        .screen { display:none; }
        .screen.active { display:block; }
        .hidden { display:none !important; }
        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.3); backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:20px; z-index:999; }
        .modal-box { background:#fff; border-radius:24px; max-width:400px; width:100%; padding:24px; max-height:90vh; overflow-y:auto; }
        .modal-box h2 { font-size:20px; margin-bottom:16px; }
        .onboarding { text-align:center; padding:20px 0; }
        .onboarding .emoji-big { font-size:56px; margin-bottom:12px; }
        .onboarding h2 { font-size:22px; margin-bottom:8px; }
        .onboarding p { color:#7a6e66; margin-bottom:20px; }
        .tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500; background:#f7e4d6; color:#d4916b; }
        .product-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .product-card { background:#faf6f0; border-radius:12px; padding:12px; border:1px solid #efe8e0; }
        .product-card .name { font-weight:500; font-size:15px; }
        .product-card .meta { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; }
        @media (max-width:380px) { .product-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Шапка -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0;">
        <h1 style="font-size:20px;">🌸 Прикорм</h1>
        <span id="greeting" style="color:#7a6e66; font-size:14px;">👋 Привет!</span>
    </div>

    <!-- Онбординг -->
    <div id="screen-onboarding" class="screen active">
        <div class="card">
            <div class="onboarding">
                <div class="emoji-big">🌸</div>
                <h2>Привет, мама!</h2>
                <p>Давайте познакомимся с малышом.</p>
                <button class="btn" id="startBtn">Начать</button>
            </div>
        </div>
    </div>

    <!-- Основной контейнер (скрыт до заполнения профиля) -->
    <div id="main-container" style="display:none;">
        <!-- Главная -->
        <div id="screen-home" class="screen active">
            <div class="card">
                <h2>👋 Привет, <span id="motherName">мама</span>!</h2>
                <div class="sub" id="babyInfo"></div>
            </div>
            <div class="card">
                <h2>📊 Данные малыша</h2>
                <div id="profileData"></div>
            </div>
        </div>
        <!-- План -->
        <div id="screen-plan" class="screen">
            <div class="card"><h2>📅 План</h2><div class="sub">Индивидуальный план прикорма</div></div>
        </div>
        <!-- Продукты -->
        <div id="screen-products" class="screen">
            <div class="card"><h2>🥕 Продукты</h2><div id="productGrid" class="product-grid"></div></div>
        </div>
        <!-- Дневник -->
        <div id="screen-diary" class="screen">
            <div class="card"><h2>📖 Дневник</h2><div id="diaryList"><span class="sub">Пока нет записей</span></div></div>
            <button class="btn btn-outline" id="addDiaryBtn" style="margin-top:8px;">➕ Добавить запись</button>
        </div>
        <!-- Профиль -->
        <div id="screen-profile" class="screen">
            <div class="card">
                <h2>👶 Профиль</h2>
                <div id="profileFields"></div>
                <button class="btn btn-outline mt-8" id="editProfileBtn">✏️ Редактировать</button>
                <button class="btn btn-danger mt-8" id="resetData">🗑 Сбросить</button>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav" id="bottomNav" style="display:none;">
        <button class="tab active" data-tab="home"><span class="icon">🏠</span>Главная</button>
        <button class="tab" data-tab="plan"><span class="icon">📅</span>План</button>
        <button class="tab" data-tab="products"><span class="icon">🥕</span>Продукты</button>
        <button class="tab" data-tab="diary"><span class="icon">📖</span>Дневник</button>
        <button class="tab" data-tab="profile"><span class="icon">👶</span>Профиль</button>
    </div>
</div>

<!-- Модалка онбординга -->
<div id="modal" class="modal">
    <div class="modal-box">
        <h2>🌸 Данные малыша</h2>
        <div class="input-group"><label>Имя мамы</label><input type="text" id="inpMother" placeholder="Анна"></div>
        <div class="input-group"><label>Имя малыша</label><input type="text" id="inpBaby" placeholder="София"></div>
        <div class="input-group"><label>Дата рождения (ДД.ММ.ГГГГ)</label><input type="text" id="inpBirth" placeholder="21.02.2026"></div>
        <div class="input-group"><label>Тип вскармливания</label>
            <select id="inpFeeding"><option value="ГВ">ГВ</option><option value="ИВ">ИВ</option><option value="Смешанное">Смешанное</option></select>
        </div>
        <div class="input-group"><label>Пол</label>
            <select id="inpGender"><option value="Мальчик">Мальчик</option><option value="Девочка">Девочка</option></select>
        </div>
        <button class="btn" id="saveBtn">Сохранить</button>
    </div>
</div>

<!-- Модалка дневника -->
<div id="diaryModal" class="modal">
    <div class="modal-box">
        <h2>📝 Запись</h2>
        <div class="input-group"><label>Продукт</label><input type="text" id="diaryProduct" placeholder="Название"></div>
        <div class="input-group"><label>Дата</label><input type="text" id="diaryDate" placeholder="ДД.ММ.ГГГГ"></div>
        <div class="input-group"><label>Реакция</label>
            <select id="diaryReaction"><option value="Всё хорошо">🟢 Всё хорошо</option><option value="Незначительные изменения">🟡 Незначительные изменения</option><option value="Подозрительная реакция">🟠 Подозрительная реакция</option><option value="Выраженная реакция">🔴 Выраженная реакция</option></select>
        </div>
        <div class="input-group"><label>Заметка</label><input type="text" id="diaryNotes" placeholder="Необязательно"></div>
        <button class="btn" id="saveDiaryBtn">Сохранить</button>
    </div>
</div>

<script>
    const KEY = 'prikorm_app_v2';
    let profile = null;

    function loadProfile() {
        try {
            const raw = localStorage.getItem(KEY);
            if (raw) profile = JSON.parse(raw);
            else profile = null;
        } catch(e) { profile = null; }
    }

    function saveProfile() {
        localStorage.setItem(KEY, JSON.stringify(profile));
    }

    function resetProfile() {
        localStorage.removeItem(KEY);
        profile = null;
        location.reload();
    }

    function calcAge(birth) {
        if (!birth) return {months:0, days:0};
        const parts = birth.split('.');
        if (parts.length!==3) return {months:0, days:0};
        const b = new Date(parts[2], parts[1]-1, parts[0]);
        const now = new Date();
        let m = (now.getFullYear()-b.getFullYear())*12 + (now.getMonth()-b.getMonth());
        let d = now.getDate()-b.getDate();
        if (d<0) { m--; const pm = new Date(now.getFullYear(), now.getMonth(), 0); d += pm.getDate(); }
        if (m<0) m=0;
        return {months:m, days:d};
    }

    function render() {
        if (!profile || !profile.baby_name) {
            document.getElementById('screen-onboarding').classList.add('active');
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('bottomNav').style.display = 'none';
            return;
        }
        document.getElementById('screen-onboarding').classList.remove('active');
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('bottomNav').style.display = 'flex';

        const age = calcAge(profile.birth_date);
        document.getElementById('greeting').textContent = `👋 ${profile.mother_name || 'мама'}`;
        document.getElementById('motherName').textContent = profile.mother_name || 'мама';
        document.getElementById('babyInfo').textContent = `👶 ${profile.baby_name} — ${age.months} мес. ${age.days} дн. (${profile.feeding_type || 'ГВ'})`;

        // Профиль
        const fields = [
            ['Мама', profile.mother_name || '—'],
            ['Малыш', profile.baby_name || '—'],
            ['Дата рождения', profile.birth_date || '—'],
            ['Пол', profile.gender || '—'],
            ['Тип вскармливания', profile.feeding_type || '—'],
            ['Введено продуктов', (profile.introduced_foods||[]).length],
        ];
        document.getElementById('profileFields').innerHTML = fields.map(([l,v]) => `<div class="row"><span class="label">${l}</span><span class="value">${v}</span></div>`).join('');

        // Краткие данные на главной
        document.getElementById('profileData').innerHTML = fields.map(([l,v]) => `<div class="row"><span class="label">${l}</span><span class="value">${v}</span></div>`).join('');

        // Продукты (пока заглушка)
        const grid = document.getElementById('productGrid');
        const demo = ['Кабачок', 'Брокколи', 'Цветная капуста', 'Гречка', 'Рис', 'Индейка'];
        grid.innerHTML = demo.map(name => `
            <div class="product-card"><div class="name">${name}</div><div class="meta"><span class="tag">рекомендуется</span></div></div>
        `).join('');

        // Дневник
        const history = profile.food_history || [];
        const diaryList = document.getElementById('diaryList');
        if (history.length===0) {
            diaryList.innerHTML = '<span class="sub">Пока нет записей</span>';
        } else {
            diaryList.innerHTML = history.slice().reverse().map(item => `
                <div class="row"><span class="label">${item.product}</span><span class="value">${item.date} ${item.reaction||''}</span></div>
            `).join('');
        }
    }

    // Модалка онбординга
    document.getElementById('startBtn').addEventListener('click', function() {
        document.getElementById('modal').style.display = 'flex';
    });
    document.getElementById('editProfileBtn').addEventListener('click', function() {
        document.getElementById('inpMother').value = profile.mother_name || '';
        document.getElementById('inpBaby').value = profile.baby_name || '';
        document.getElementById('inpBirth').value = profile.birth_date || '';
        document.getElementById('inpFeeding').value = profile.feeding_type || 'ГВ';
        document.getElementById('inpGender').value = profile.gender || 'Мальчик';
        document.getElementById('modal').style.display = 'flex';
    });

    document.getElementById('saveBtn').addEventListener('click', function() {
        const mother = document.getElementById('inpMother').value.trim();
        const baby = document.getElementById('inpBaby').value.trim();
        const birth = document.getElementById('inpBirth').value.trim();
        const feeding = document.getElementById('inpFeeding').value;
        const gender = document.getElementById('inpGender').value;
        if (!mother || !baby || !birth) { alert('Заполните все поля'); return; }
        const parts = birth.split('.');
        if (parts.length!==3 || isNaN(parts[0]) || isNaN(parts[1]) || isNaN(parts[2])) {
            alert('Введите дату в формате ДД.ММ.ГГГГ');
            return;
        }
        if (!profile) profile = {};
        profile.mother_name = mother;
        profile.baby_name = baby;
        profile.birth_date = birth;
        profile.feeding_type = feeding;
        profile.gender = gender;
        profile.introduced_foods = profile.introduced_foods || [];
        profile.food_history = profile.food_history || [];
        saveProfile();
        document.getElementById('modal').style.display = 'none';
        render();
    });

    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
    });

    // Дневник
    document.getElementById('addDiaryBtn').addEventListener('click', function() {
        document.getElementById('diaryProduct').value = '';
        document.getElementById('diaryDate').value = new Date().toLocaleDateString('ru-RU');
        document.getElementById('diaryReaction').value = 'Всё хорошо';
        document.getElementById('diaryNotes').value = '';
        document.getElementById('diaryModal').style.display = 'flex';
    });
    document.getElementById('saveDiaryBtn').addEventListener('click', function() {
        const product = document.getElementById('diaryProduct').value.trim();
        const date = document.getElementById('diaryDate').value.trim();
        const reaction = document.getElementById('diaryReaction').value;
        const notes = document.getElementById('diaryNotes').value.trim();
        if (!product || !date) { alert('Заполните продукт и дату'); return; }
        if (!profile) return;
        if (!profile.food_history) profile.food_history = [];
        profile.food_history.push({ product, date, reaction, notes });
        if (!profile.introduced_foods.includes(product)) {
            profile.introduced_foods.push(product);
        }
        saveProfile();
        document.getElementById('diaryModal').style.display = 'none';
        render();
    });
    document.getElementById('diaryModal').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
    });

    // Сброс
    document.getElementById('resetData').addEventListener('click', function() {
        if (confirm('Удалить все данные?')) resetProfile();
    });

    // Навигация
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            const tabName = this.dataset.tab;
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-'+tabName).classList.add('active');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Запуск
    loadProfile();
    render();
</script>
</body>
</html>
