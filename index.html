<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прикорм</title>
    <style>
        /* Минимальные стили, чтобы точно видеть содержимое */
        body { font-family: sans-serif; background: #f5f0eb; margin: 0; padding: 0; display: flex; justify-content: center; }
        #app { max-width: 480px; width: 100%; background: white; min-height: 100vh; padding-bottom: 70px; position: relative; }
        .screen { display: block; padding: 16px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .page-header h1 { font-size: 24px; margin: 0; }
        .baby-card { display: flex; align-items: center; background: #fafafa; padding: 16px; border-radius: 12px; margin: 12px 0; }
        .baby-avatar { font-size: 48px; margin-right: 16px; }
        .progress-card { background: #fafafa; padding: 16px; border-radius: 12px; margin: 12px 0; }
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
        .quick-action { background: #fafafa; border: none; border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; }
        .quick-action span { font-size: 28px; display: block; }
        .quick-action strong { display: block; margin-top: 6px; }
        .quick-action small { color: #888; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; background: white; padding: 8px 0; border-top: 1px solid #ddd; }
        .bottom-nav button { background: none; border: none; font-size: 12px; color: #888; cursor: pointer; }
        .bottom-nav button.active { color: #d4a373; font-weight: bold; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product-item { background: #fafafa; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }
        .product-item .emoji { font-size: 30px; display: block; }
        .diary-entry { display: flex; align-items: center; background: #fafafa; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
        .diary-entry .info { flex: 1; }
        .settings-row { display: flex; align-items: center; background: #fafafa; padding: 12px; border-radius: 8px; margin-bottom: 6px; border: none; width: 100%; text-align: left; cursor: pointer; }
        .settings-row span:first-child { font-size: 20px; margin-right: 12px; }
        .settings-row div { flex: 1; }
        .settings-row strong { display: block; }
        .settings-row small { color: #888; }
        .danger-button { background: #e74c3c; color: white; border: none; border-radius: 8px; padding: 14px; width: 100%; font-weight: bold; cursor: pointer; margin: 16px 0; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state .empty-icon { font-size: 64px; }
        .empty-state h3 { font-size: 18px; color: #555; }
        .empty-state p { font-size: 14px; }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    // ============================================================
    // 1. ДАННЫЕ (продукты, рецепты)
    // ============================================================
    const PRODUCTS = [
        { id:'courgette', name:'Кабачок', cat:'овощ', min_age:4, emoji:'🥒' },
        { id:'broccoli', name:'Брокколи', cat:'овощ', min_age:4, emoji:'🥦' },
        { id:'cauliflower', name:'Цветная капуста', cat:'овощ', min_age:4, emoji:'🥦' },
        { id:'pumpkin', name:'Тыква', cat:'овощ', min_age:5, emoji:'🎃' },
        { id:'carrot', name:'Морковь', cat:'овощ', min_age:5, emoji:'🥕' },
        { id:'potato', name:'Картофель', cat:'овощ', min_age:5, emoji:'🥔' },
        { id:'apple', name:'Яблоко', cat:'фрукт', min_age:6, emoji:'🍎' },
        { id:'pear', name:'Груша', cat:'фрукт', min_age:6, emoji:'🍐' },
        { id:'banana', name:'Банан', cat:'фрукт', min_age:6, emoji:'🍌' },
        { id:'buckwheat', name:'Гречка', cat:'каша', min_age:4, emoji:'🌾' },
        { id:'rice', name:'Рис', cat:'каша', min_age:4, emoji:'🍚' },
        { id:'turkey', name:'Индейка', cat:'мясо', min_age:6, emoji:'🦃' },
        { id:'chicken', name:'Курица', cat:'мясо', min_age:6, emoji:'🐔' },
        { id:'beef', name:'Говядина', cat:'мясо', min_age:6, emoji:'🥩' },
        { id:'cod', name:'Треска', cat:'рыба', min_age:8, emoji:'🐟' },
        { id:'salmon', name:'Лосось', cat:'рыба', min_age:8, emoji:'🐠' },
        { id:'egg', name:'Яйцо', cat:'яйцо', min_age:6, emoji:'🥚' },
        { id:'yogurt', name:'Йогурт', cat:'молочное', min_age:6, emoji:'🥛' },
        { id:'lentil', name:'Чечевица', cat:'бобовые', min_age:7, emoji:'🫘' },
        { id:'peanut', name:'Арахис', cat:'орехи', min_age:6, emoji:'🥜' }
    ];
    const RECIPES = [
        { name:'Пюре из кабачка', desc:'Отварить и измельчить', age:4 },
        { name:'Каша гречневая', desc:'Сварить на воде', age:4 },
        { name:'Пюре из индейки', desc:'Отварить и пюрировать', age:6 }
    ];

    // ============================================================
    // 2. СОСТОЯНИЕ (простой объект, без localStorage для простоты)
    // ============================================================
    let STATE = {
        baby: { name: 'Малыш', ageMonths: 6, feedingType: 'ГВ' },
        diary: [],
        products: { introduced: [] },
        ui: { screen: 'home' }
    };

    // ============================================================
    // 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function isProductIntroduced(id) {
        return STATE.products.introduced.some(i => i === id || i.id === id);
    }

    // ============================================================
    // 4. РЕНДЕРИНГ (полный, без тем)
    // ============================================================
    function render(screen) {
        screen = screen || STATE.ui.screen || 'home';
        const app = document.getElementById('app');
        if (!app) return;

        let mainHTML = '';

        // Верхняя навигация (вкладки)
        const tabs = ['home', 'products', 'diary', 'recipes', 'baby'];
        const tabLabels = { home:'🏠', products:'🥑', diary:'📖', recipes:'🍲', baby:'👶' };
        mainHTML += `<div style="display:flex; gap:10px; background:#fff; padding:10px; border-radius:12px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">`;
        tabs.forEach(t => {
            mainHTML += `<button data-screen="${t}" style="flex:1; padding:10px; border:none; background:${screen===t?'#d4a373':'#f0ebe7'}; border-radius:10px; cursor:pointer; font-weight:${screen===t?'bold':'normal'}; color:${screen===t?'white':'#333'};">${tabLabels[t]}</button>`;
        });
        mainHTML += `</div>`;

        // Содержимое экрана
        switch (screen) {
            case 'home':
                mainHTML += renderHome();
                break;
            case 'products':
                mainHTML += renderProducts();
                break;
            case 'diary':
                mainHTML += renderDiary();
                break;
            case 'recipes':
                mainHTML += renderRecipes();
                break;
            case 'baby':
                mainHTML += renderBaby();
                break;
            default:
                mainHTML += renderHome();
        }

        // Нижняя навигация (дублирует верхнюю, но фиксированная)
        mainHTML += `<div class="bottom-nav">`;
        tabs.forEach(t => {
            mainHTML += `<button data-screen="${t}" class="${screen===t?'active':''}" style="background:none; border:none; font-size:12px; color:${screen===t?'#d4a373':'#888'}; cursor:pointer;">${tabLabels[t]}<br><small>${t}</small></button>`;
        });
        mainHTML += `</div>`;

        app.innerHTML = mainHTML;

        // Обработчики кликов по кнопкам навигации
        document.querySelectorAll('[data-screen]').forEach(btn => {
            btn.addEventListener('click', function() {
                const s = this.dataset.screen;
                if (s) {
                    STATE.ui.screen = s;
                    render(s);
                }
            });
        });

        // Обработчики для других кнопок (упрощённо)
        document.querySelectorAll('[data-action="add-product"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const name = this.dataset.name;
                if (name && !isProductIntroduced(name)) {
                    STATE.products.introduced.push(name);
                    render(STATE.ui.screen);
                }
            });
        });
        document.querySelectorAll('[data-action="edit-baby"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const newName = prompt('Имя малыша:', STATE.baby.name);
                if (newName !== null) {
                    STATE.baby.name = newName || 'Малыш';
                    render('baby');
                }
            });
        });
        document.querySelectorAll('[data-action="reset"]').forEach(btn => {
            btn.addEventListener('click', function() {
                if (confirm('Удалить все данные?')) {
                    STATE.diary = [];
                    STATE.products.introduced = [];
                    STATE.baby = { name: 'Малыш', ageMonths: 6, feedingType: 'ГВ' };
                    render('home');
                }
            });
        });
        document.querySelectorAll('.product-item').forEach(el => {
            el.addEventListener('click', function() {
                const name = this.dataset.name;
                if (name) {
                    STATE.diary.push({ product: name, date: new Date().toISOString().slice(0,10) });
                    render(STATE.ui.screen);
                }
            });
        });
    }

    function renderHome() {
        const baby = STATE.baby;
        const diaryCount = STATE.diary.length;
        return `
            <div class="screen">
                <div class="page-header"><h1>🌸 Прикорм</h1></div>
                <div class="baby-card">
                    <div class="baby-avatar">👶</div>
                    <div><strong>${baby.name}</strong><br>${baby.ageMonths} мес.</div>
                </div>
                <div class="progress-card">
                    <div><strong>Дневник</strong> <span style="float:right;">${diaryCount} записей</span></div>
                </div>
                <div class="quick-actions">
                    <button class="quick-action" data-action="add-product" data-name="Новый продукт"><span>🥣</span><strong>Добавить продукт</strong><small>Записать в дневник</small></button>
                    <button class="quick-action" onclick="STATE.ui.screen='products'; render('products');"><span>🥑</span><strong>Продукты</strong><small>База</small></button>
                    <button class="quick-action" onclick="STATE.ui.screen='diary'; render('diary');"><span>📖</span><strong>Дневник</strong><small>История</small></button>
                    <button class="quick-action" onclick="STATE.ui.screen='recipes'; render('recipes');"><span>🍲</span><strong>Рецепты</strong><small>Идеи</small></button>
                </div>
            </div>
        `;
    }

    function renderProducts() {
        let html = `<div class="screen"><div class="page-header"><h1>Продукты</h1></div><div class="product-grid">`;
        PRODUCTS.forEach(p => {
            const introduced = isProductIntroduced(p.id) ? '✅' : '';
            html += `<div class="product-item" data-name="${p.id}">
                <span class="emoji">${p.emoji}</span>
                ${p.name} ${introduced}
                <div style="font-size:12px; color:#888;">${p.cat}, ${p.min_age}+ мес.</div>
            </div>`;
        });
        html += `</div></div>`;
        return html;
    }

    function renderDiary() {
        let html = `<div class="screen"><div class="page-header"><h1>Дневник</h1></div>`;
        if (STATE.diary.length === 0) {
            html += `<div class="empty-state"><div class="empty-icon">📖</div><h3>Дневник пуст</h3><p>Добавьте продукты, нажав на них в списке продуктов.</p></div>`;
        } else {
            STATE.diary.forEach(entry => {
                html += `<div class="diary-entry"><div class="info"><strong>${entry.product}</strong><br><small>${entry.date}</small></div></div>`;
            });
        }
        html += `</div>`;
        return html;
    }

    function renderRecipes() {
        let html = `<div class="screen"><div class="page-header"><h1>Рецепты</h1></div>`;
        RECIPES.forEach(r => {
            html += `<div style="background:#fafafa; padding:12px; border-radius:8px; margin-bottom:8px;"><strong>${r.name}</strong> (с ${r.age} мес.)<br><small>${r.desc}</small></div>`;
        });
        html += `</div>`;
        return html;
    }

    function renderBaby() {
        const baby = STATE.baby;
        return `
            <div class="screen">
                <div class="page-header"><h1>Малыш</h1></div>
                <div class="baby-card">
                    <div class="baby-avatar">👶</div>
                    <div><strong>${baby.name}</strong><br>${baby.ageMonths} мес.</div>
                    <button data-action="edit-baby" style="margin-left:auto; background:none; border:none; font-size:24px; cursor:pointer;">✏️</button>
                </div>
                <div style="margin-top:16px;">
                    <div class="settings-row"><span>🍼</span><div><strong>Тип кормления</strong><br><small>${baby.feedingType}</small></div></div>
                </div>
                <button class="danger-button" data-action="reset">Сбросить все данные</button>
            </div>
        `;
    }

    // ============================================================
    // 5. ЗАПУСК
    // ============================================================
    render('home');
</script>
</body>
</html>
