<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прикорм 🌸</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Roboto,sans-serif;background:#f5f0eb;display:flex;justify-content:center;padding:0}
        #app{max-width:480px;width:100%;background:#fff;min-height:100vh;padding:16px 16px 80px;position:relative}

        /* ===== Стили для онбординга ===== */
        .onboarding{display:flex;flex-direction:column;justify-content:center;height:80vh;padding:0 16px;text-align:center}
        .onboarding h1{font-size:28px;font-weight:700;margin-bottom:8px;color:#2d1f14}
        .onboarding p{font-size:18px;color:#555;margin-bottom:24px}
        .onboarding .emoji-big{font-size:72px;margin-bottom:20px}
        .onboarding .step-indicators{display:flex;justify-content:center;gap:8px;margin:20px 0}
        .onboarding .step-indicators span{width:10px;height:10px;border-radius:50%;background:#ddd;transition:0.3s}
        .onboarding .step-indicators span.active{background:#d4a373;width:24px;border-radius:12px}
        .onboarding .btn-group{display:flex;flex-direction:column;gap:12px;margin-top:16px}
        .onboarding .btn-group button{padding:16px;border:none;border-radius:16px;font-size:18px;font-weight:600;background:#f0ebe7;cursor:pointer;transition:0.2s}
        .onboarding .btn-group button:active{transform:scale(0.96)}
        .onboarding .btn-group button.primary{background:#d4a373;color:#fff}
        .onboarding .btn-group button.secondary{background:transparent;color:#888;font-weight:400}
        .onboarding input[type="date"], .onboarding input[type="text"]{width:100%;padding:16px;border:2px solid #ddd;border-radius:16px;font-size:18px;text-align:center;margin:12px 0;background:#fafafa}
        .onboarding .skip{color:#999;font-size:14px;margin-top:16px;background:none;border:none;text-decoration:underline;cursor:pointer}

        /* ===== Остальные стили (главный экран и т.д.) ===== */
        .tab-bar{display:flex;gap:10px;background:#fff;padding:10px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .tab-bar button{flex:1;padding:10px;border:none;border-radius:10px;background:#f0ebe7;cursor:pointer;font-weight:600}
        .tab-bar button.active{background:#d4a373;color:#fff}
        .page{display:none}
        .page.active{display:block}
        .baby-card{display:flex;align-items:center;background:#fafafa;padding:16px;border-radius:12px;margin:12px 0}
        .baby-avatar{font-size:48px;margin-right:16px}
        .progress-card{background:#fafafa;padding:16px;border-radius:12px;margin:12px 0}
        .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
        .quick-action{background:#fafafa;border:none;border-radius:12px;padding:16px;text-align:left;cursor:pointer}
        .quick-action span{font-size:28px;display:block}
        .quick-action strong{display:block;margin-top:6px}
        .quick-action small{color:#888}
        .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
        .product-item{background:#fafafa;padding:12px;border-radius:8px;text-align:center;cursor:pointer}
        .product-item .emoji{font-size:30px;display:block}
        .diary-entry{display:flex;align-items:center;background:#fafafa;padding:12px;border-radius:8px;margin-bottom:8px}
        .diary-entry .info{flex:1}
        .settings-row{display:flex;align-items:center;background:#fafafa;padding:12px;border-radius:8px;margin-bottom:6px;border:none;width:100%;text-align:left;cursor:pointer}
        .settings-row span:first-child{font-size:20px;margin-right:12px}
        .settings-row div{flex:1}
        .settings-row strong{display:block}
        .settings-row small{color:#888}
        .danger-button{background:#e74c3c;color:#fff;border:none;border-radius:8px;padding:14px;width:100%;font-weight:700;cursor:pointer;margin:16px 0}
        .empty-state{text-align:center;padding:40px 20px;color:#999}
        .empty-state .empty-icon{font-size:64px}
        .empty-state h3{font-size:18px;color:#555}
        .empty-state p{font-size:14px}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;background:#fff;padding:8px 0;border-top:1px solid #ddd}
        .bottom-nav button{background:none;border:none;font-size:12px;color:#888;cursor:pointer}
        .bottom-nav button.active{color:#d4a373;font-weight:700}
    </style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// 1. СОСТОЯНИЕ ПРИЛОЖЕНИЯ (с полями для онбординга)
// ============================================================
const DEFAULT_STATE = {
    baby: {
        name: '',
        birthDate: '',
        feedingType: 'ГВ',
        feedingStarted: false,
        feedingStartDate: '',
        approach: 'mixed'
    },
    diary: [],
    introduced: [],
    favorites: [],
    reactions: [],
    settings: {
        theme: 'light'
    },
    onboardingCompleted: false
};

let STATE = JSON.parse(localStorage.getItem('prikorm_app_state')) || JSON.parse(JSON.stringify(DEFAULT_STATE));

function saveState() {
    localStorage.setItem('prikorm_app_state', JSON.stringify(STATE));
}

// ============================================================
// 2. ПРОДУКТЫ (полный список из вашего файла, оставлю 162)
// ============================================================
// (здесь должен быть полный массив PRODUCTS – я не буду дублировать его для краткости, но вы вставите свой полный список)
// Для теста возьмём сокращённый, но вы замените на свой.
const PRODUCTS = [
    { id:'courgette', name:'Кабачок', cat:'овощ', min_age:4, emoji:'🥒' },
    { id:'broccoli', name:'Брокколи', cat:'овощ', min_age:4, emoji:'🥦' },
    { id:'cauliflower', name:'Цветная капуста', cat:'овощ', min_age:4, emoji:'🥦' },
    { id:'pumpkin', name:'Тыква', cat:'овощ', min_age:5, emoji:'🎃' },
    { id:'carrot', name:'Морковь', cat:'овощ', min_age:5, emoji:'🥕' },
    // ... остальные продукты добавьте сюда из вашего файла
];

// РЕЦЕПТЫ
const RECIPES = [
    { name:'Пюре из кабачка', products:['Кабачок'], age:4, desc:'Отварить кабачок до мягкости, измельчить блендером.' },
    { name:'Пюре из цветной капусты', products:['Цветная капуста'], age:4, desc:'Отварить соцветия, пюрировать.' },
    // ... остальные
];

// ============================================================
// 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================================
function isIntroduced(id) {
    return STATE.introduced.some(i => i === id);
}

function calcAge(birthDate) {
    if (!birthDate) return { months: 0, days: 0 };
    const birth = new Date(birthDate);
    const today = new Date();
    let months = (today.getFullYear() - birth.getFullYear()) * 12 + (today.getMonth() - birth.getMonth());
    if (today.getDate() < birth.getDate()) months--;
    return { months: Math.max(0, months) };
}

// ============================================================
// 4. ОНБОРДИНГ
// ============================================================
function renderOnboarding() {
    const app = document.getElementById('app');
    if (!app) return;
    let step = 0;
    const totalSteps = 5;

    const renderStep = (stepIndex) => {
        let html = `<div class="onboarding">`;
        // Индикаторы шагов
        html += `<div class="step-indicators">`;
        for (let i = 0; i < totalSteps; i++) {
            html += `<span class="${i === stepIndex ? 'active' : ''}"></span>`;
        }
        html += `</div>`;

        // Содержимое шага
        switch (stepIndex) {
            case 0:
                html += `
                    <div class="emoji-big">👶</div>
                    <h1>Как зовут малыша?</h1>
                    <p>Вы можете пропустить, если хотите</p>
                    <input type="text" id="onboarding-name" placeholder="Имя ребёнка" value="${STATE.baby.name || ''}">
                    <button class="skip" data-action="skip-name">Пропустить →</button>
                `;
                break;
            case 1:
                html += `
                    <div class="emoji-big">📅</div>
                    <h1>Дата рождения</h1>
                    <p>Мы рассчитаем возраст автоматически</p>
                    <input type="date" id="onboarding-birth" value="${STATE.baby.birthDate || ''}">
                `;
                break;
            case 2:
                html += `
                    <div class="emoji-big">🍼</div>
                    <h1>Тип вскармливания</h1>
                    <div class="btn-group">
                        <button class="primary" data-value="ГВ">🤱 Грудное</button>
                        <button class="primary" data-value="ИВ">🍼 Искусственное</button>
                        <button class="primary" data-value="Смешанное">🤍 Смешанное</button>
                    </div>
                `;
                break;
            case 3:
                html += `
                    <div class="emoji-big">🌱</div>
                    <h1>Вы уже начали прикорм?</h1>
                    <div class="btn-group">
                        <button class="primary" data-value="yes">Да</button>
                        <button class="primary" data-value="no">Нет</button>
                    </div>
                    <div id="start-date-field" style="display:none; margin-top:16px;">
                        <label style="font-size:16px; color:#555;">Дата начала прикорма</label>
                        <input type="date" id="onboarding-start-date">
                    </div>
                `;
                break;
            case 4:
                html += `
                    <div class="emoji-big">🥄</div>
                    <h1>Выберите подход</h1>
                    <p>Это можно изменить позже</p>
                    <div class="btn-group">
                        <button class="primary" data-value="puree">🥄 Пюре</button>
                        <button class="primary" data-value="blw">🖐 BLW / Finger food</button>
                        <button class="primary" data-value="mixed">🥣 Комбинированный</button>
                        <button class="secondary" data-value="unknown">🤷 Пока не знаю</button>
                    </div>
                `;
                break;
        }

        // Кнопки "Назад" и "Далее"
        if (stepIndex > 0) {
            html += `<button class="secondary" data-action="prev-step" style="margin-top:20px;">← Назад</button>`;
        }
        if (stepIndex < totalSteps - 1) {
            html += `<button class="primary" data-action="next-step" style="margin-top:12px;">Далее →</button>`;
        } else {
            html += `<button class="primary" data-action="finish-onboarding" style="margin-top:12px;">🚀 Начать!</button>`;
        }

        html += `</div>`;
        app.innerHTML = html;

        // Обработчики для этого шага
        document.querySelectorAll('[data-action="next-step"]').forEach(btn => {
            btn.addEventListener('click', () => {
                // Сохраняем данные с текущего шага
                if (stepIndex === 0) {
                    const name = document.getElementById('onboarding-name')?.value.trim() || '';
                    STATE.baby.name = name;
                    saveState();
                }
                if (stepIndex === 1) {
                    const birth = document.getElementById('onboarding-birth')?.value || '';
                    STATE.baby.birthDate = birth;
                    if (birth) {
                        const age = calcAge(birth);
                        STATE.baby.ageMonths = age.months;
                    }
                    saveState();
                }
                if (stepIndex === 2) {
                    // выберем значение из кнопок
                }
                if (stepIndex === 3) {
                    // обработаем выбор да/нет и дату
                }
                step = stepIndex + 1;
                renderStep(step);
            });
        });

        document.querySelectorAll('[data-action="prev-step"]').forEach(btn => {
            btn.addEventListener('click', () => {
                step = stepIndex - 1;
                renderStep(step);
            });
        });

        // Обработчики для кнопок выбора
        document.querySelectorAll('[data-value]').forEach(btn => {
            btn.addEventListener('click', function() {
                const val = this.dataset.value;
                if (stepIndex === 2) {
                    STATE.baby.feedingType = val;
                    saveState();
                    // Подсветим выбранное
                    document.querySelectorAll('.btn-group button').forEach(b => b.style.border = 'none');
                    this.style.border = '3px solid #d4a373';
                }
                if (stepIndex === 3) {
                    if (val === 'yes') {
                        STATE.baby.feedingStarted = true;
                        document.getElementById('start-date-field').style.display = 'block';
                    } else {
                        STATE.baby.feedingStarted = false;
                        STATE.baby.feedingStartDate = '';
                        document.getElementById('start-date-field').style.display = 'none';
                    }
                    saveState();
                    this.style.border = '3px solid #d4a373';
                }
                if (stepIndex === 4) {
                    STATE.baby.approach = val;
                    saveState();
                    document.querySelectorAll('.btn-group button').forEach(b => b.style.border = 'none');
                    this.style.border = '3px solid #d4a373';
                }
            });
        });

        // Обработчик для поля даты начала
        document.getElementById('onboarding-start-date')?.addEventListener('change', function() {
            STATE.baby.feedingStartDate = this.value;
            saveState();
        });

        // Пропуск имени
        document.querySelector('[data-action="skip-name"]')?.addEventListener('click', function() {
            step = 1;
            renderStep(step);
        });

        // Финиш
        document.querySelector('[data-action="finish-onboarding"]')?.addEventListener('click', function() {
            // Сохраняем последний шаг (подход)
            STATE.onboardingCompleted = true;
            saveState();
            renderApp();
        });
    };

    renderStep(0);
}

// ============================================================
// 5. ГЛАВНОЕ ПРИЛОЖЕНИЕ
// ============================================================
function renderApp() {
    const app = document.getElementById('app');
    if (!app) return;

    // Если онбординг не завершён – показываем его
    if (!STATE.onboardingCompleted || !STATE.baby.birthDate) {
        renderOnboarding();
        return;
    }

    // Иначе рендерим основной интерфейс (как у вас было)
    // Здесь будет ваш существующий код render() – я его оставлю без изменений
    // Но для краткости я покажу упрощённую версию, а вы вставите свою полную.
    // На самом деле, лучше взять ваш предыдущий render и вставить его сюда.
    // Я дам общий каркас, а вы скопируете свой рендеринг.
    // Пока просто заглушка:
    app.innerHTML = `
        <div style="text-align:center; padding:40px;">
            <h1>🌸 Прикорм</h1>
            <p>Привет, ${STATE.baby.name || 'Малыш'}! Возраст: ${calcAge(STATE.baby.birthDate).months} мес.</p>
            <p>Тип вскармливания: ${STATE.baby.feedingType}</p>
            <p>Подход: ${STATE.baby.approach}</p>
            <p>Прикорм начат: ${STATE.baby.feedingStarted ? 'Да, с ' + STATE.baby.feedingStartDate : 'Нет'}</p>
            <button onclick="STATE.onboardingCompleted=false; saveState(); renderApp();">Сбросить онбординг</button>
            <button onclick="console.log(STATE)">Показать STATE</button>
        </div>
    `;
}

// ============================================================
// 6. ЗАПУСК
// ============================================================
renderApp();
</script>
</body>
</html>
