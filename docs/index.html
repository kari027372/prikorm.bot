<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f8f4f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Прикорм 🌸</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f8f4f0; padding:16px; color:#2c2c2c; }
        .container { max-width:450px; margin:0 auto; }
        .card { background:#fff; border-radius:20px; padding:20px; margin-bottom:16px; border:1px solid #efe8e0; }
        .btn { display:block; width:100%; padding:14px; background:#e8a87c; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:500; cursor:pointer; }
        .btn:active { background:#d4916b; }
        .input-group { margin-bottom:14px; }
        .input-group label { display:block; font-size:14px; color:#7a6e66; margin-bottom:4px; }
        .input-group input, .input-group select { width:100%; padding:10px 14px; border:1px solid #efe8e0; border-radius:12px; font-size:16px; background:#faf6f0; }
        .screen { display: none; }
        .screen.active { display: block; }
        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.3); backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:20px; z-index:999; }
        .modal .modal-box { background:#fff; border-radius:24px; max-width:400px; width:100%; padding:24px; }
        .hidden { display:none; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="font-size:20px; padding:12px 0;">🌸 Прикорм</h1>

    <!-- Онбординг -->
    <div id="onboarding" class="screen active">
        <div class="card" style="text-align:center; padding:40px 20px;">
            <div style="font-size:64px; margin-bottom:16px;">🌸</div>
            <h2 style="margin-bottom:8px;">Привет, мама!</h2>
            <p style="color:#7a6e66; margin-bottom:20px;">Давайте познакомимся с малышом.</p>
            <button class="btn" id="startBtn">Начать</button>
        </div>
    </div>

    <!-- Главный экран -->
    <div id="mainScreen" class="screen">
        <div class="card">
            <h2>👋 Привет, <span id="motherName">мама</span>!</h2>
            <p style="color:#7a6e66;" id="babyAge"></p>
        </div>
        <div class="card">
            <h2>📊 Данные</h2>
            <div id="info"><p style="color:#7a6e66;">Заполните анкету</p></div>
        </div>
        <button class="btn" id="resetBtn" style="background:#d44a4a;">🗑 Сбросить</button>
        <button class="btn" id="editBtn" style="background:#7ea8c4; margin-top:10px;">✏️ Редактировать</button>
    </div>

    <!-- Модалка -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <h2>🌸 Данные малыша</h2>
            <div class="input-group"><label>Имя мамы</label><input type="text" id="inpMother" placeholder="Анна"></div>
            <div class="input-group"><label>Имя малыша</label><input type="text" id="inpBaby" placeholder="София"></div>
            <div class="input-group"><label>Дата рождения (ДД.ММ.ГГГГ)</label><input type="text" id="inpBirth" placeholder="21.02.2026"></div>
            <div class="input-group"><label>Тип вскармливания</label>
                <select id="inpFeeding"><option value="ГВ">ГВ</option><option value="ИВ">ИВ</option><option value="Смешанное">Смешанное</option></select>
            </div>
            <button class="btn" id="saveBtn">Сохранить</button>
        </div>
    </div>
</div>

<script>
    const KEY = 'prikorm_data';
    let profile = null;

    function loadProfile() {
        try {
            const raw = localStorage.getItem(KEY);
            if (raw) profile = JSON.parse(raw);
            else profile = null;
        } catch(e) { profile = null; }
    }

    function saveProfile() {
        localStorage.setItem(KEY, JSON.stringify(profile));
    }

    function render() {
        if (!profile || !profile.baby_name) {
            document.getElementById('onboarding').classList.add('active');
            document.getElementById('mainScreen').classList.remove('active');
            return;
        }
        document.getElementById('onboarding').classList.remove('active');
        document.getElementById('mainScreen').classList.add('active');
        document.getElementById('motherName').textContent = profile.mother_name || 'мама';
        const age = profile.age_months || 0;
        const days = profile.age_days || 0;
        document.getElementById('babyAge').textContent = `👶 ${profile.baby_name} — ${age} мес. ${days} дн.`;
        document.getElementById('info').innerHTML = `
            <p><strong>Мама:</strong> ${profile.mother_name}</p>
            <p><strong>Малыш:</strong> ${profile.baby_name}</p>
            <p><strong>Дата рождения:</strong> ${profile.birth_date}</p>
            <p><strong>Вскармливание:</strong> ${profile.feeding_type}</p>
        `;
    }

    function openModal() {
        if (profile) {
            document.getElementById('inpMother').value = profile.mother_name || '';
            document.getElementById('inpBaby').value = profile.baby_name || '';
            document.getElementById('inpBirth').value = profile.birth_date || '';
            document.getElementById('inpFeeding').value = profile.feeding_type || 'ГВ';
        } else {
            document.getElementById('inpMother').value = '';
            document.getElementById('inpBaby').value = '';
            document.getElementById('inpBirth').value = '';
            document.getElementById('inpFeeding').value = 'ГВ';
        }
        document.getElementById('modal').style.display = 'flex';
    }

    document.getElementById('startBtn').addEventListener('click', openModal);
    document.getElementById('editBtn').addEventListener('click', openModal);

    document.getElementById('saveBtn').addEventListener('click', function() {
        const mother = document.getElementById('inpMother').value.trim();
        const baby = document.getElementById('inpBaby').value.trim();
        const birth = document.getElementById('inpBirth').value.trim();
        const feeding = document.getElementById('inpFeeding').value;
        if (!mother || !baby || !birth) { alert('Заполните все поля'); return; }
        const parts = birth.split('.');
        if (parts.length !== 3 || isNaN(parts[0]) || isNaN(parts[1]) || isNaN(parts[2])) {
            alert('Введите дату в формате ДД.ММ.ГГГГ');
            return;
        }
        const birthDate = new Date(parts[2], parts[1]-1, parts[0]);
        const now = new Date();
        let months = (now.getFullYear() - birthDate.getFullYear()) * 12 + (now.getMonth() - birthDate.getMonth());
        let days = now.getDate() - birthDate.getDate();
        if (days < 0) { months--; const pm = new Date(now.getFullYear(), now.getMonth(), 0); days += pm.getDate(); }
        if (months < 0) months = 0;
        profile = {
            mother_name: mother,
            baby_name: baby,
            birth_date: birth,
            feeding_type: feeding,
            age_months: months,
            age_days: days
        };
        saveProfile();
        document.getElementById('modal').style.display = 'none';
        render();
    });

    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
        if (confirm('Удалить все данные?')) {
            localStorage.removeItem(KEY);
            profile = null;
            render();
        }
    });

    loadProfile();
    render();
</script>
</body>
</html>
